<style>
/* lo oculto siempre se oculta (la ventana emergente y el aviso usan display:flex) */
[hidden]{display:none!important}
/* Layout: app shell. Phone = sticky top bar + bottom tab bar; desktop = left rail + working column. Receipts render as "paper" slips. */
:root{
  /* Marca DISALES: naranja de la tabla/título, dorado del logo, negro del logotipo */
  --bg:#F4F2EF; --surface:#FFFFFF; --sunk:#ECE8E2; --ink:#1B1A18; --muted:#6A635B; --line:#DDD6CC;
  --accent:#D2601C; --accent-ink:#FFFFFF; --accent-text:#B24A10; --accent-soft:#FCE5D3;
  --gold:#D9A21B; --gold-soft:#F7EBCB; --brand-red:#D3361C;
  --amber:#8F6A00; --amber-soft:#F7EBCB; --bad:#B42318; --bad-soft:#FADFDA; --good:#1F7A3D; --good-soft:#DDF0E2;
  --paper:#FFFFFF; --paper-ink:#1B1B18;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --tabs-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --sunk:#27231F; --ink:#EFEAE4; --muted:#A49B91; --line:#38312B;
  --accent:#D2601C; --accent-ink:#FFFFFF; --accent-text:#F6A570; --accent-soft:#3B2416;
  --gold:#E6B547; --gold-soft:#3A2F12; --brand-red:#F0705A;
  --amber:#E6B547; --amber-soft:#3A2F12; --bad:#F2806F; --bad-soft:#3E1A15; --good:#66CC87; --good-soft:#163420;
  --paper:#FAF9F6; --paper-ink:#1B1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --sunk:#27231F; --ink:#EFEAE4; --muted:#A49B91; --line:#38312B;
  --accent:#D2601C; --accent-ink:#FFFFFF; --accent-text:#F6A570; --accent-soft:#3B2416;
  --gold:#E6B547; --gold-soft:#3A2F12; --brand-red:#F0705A;
  --amber:#E6B547; --amber-soft:#3A2F12; --bad:#F2806F; --bad-soft:#3E1A15; --good:#66CC87; --good-soft:#163420;
  --paper:#FAF9F6; --paper-ink:#1B1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
a{color:var(--accent-text)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .logo{height:38px;width:auto;display:block;background:#fff;border-radius:6px;padding:2px 4px}
.top{box-shadow:inset 0 -3px 0 var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;min-width:0}
.who span{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.who span{display:none}}
.sync{margin-left:auto;font-size:.8rem;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.wait{background:var(--amber)} .dot.off{background:var(--bad)}
.me{width:30px;height:30px;border-radius:50%;background:var(--sunk);flex:none;overflow:hidden}
.me img{width:100%;height:100%;display:block}

.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
.side{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabs-h) + 28px + env(safe-area-inset-bottom,0px))}
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* bottom tabs (phone) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabs-h);font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.tabs .on{color:var(--accent-text)}
.tabs .on .ico{stroke:var(--accent-text)}
.tabs a.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs a{position:relative}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));width:220px;flex:none;padding:18px 10px 18px max(12px,env(safe-area-inset-left,0px));height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);background:var(--surface)}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
  .side a:hover{background:var(--sunk)}
  .side a.on{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
  .side a.on .ico{stroke:var(--accent-text)}
  .side .grp{margin:14px 12px 4px}
  main{padding-block:24px 48px}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.spacer{flex:1}

/* big actions on home */
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.big{grid-template-columns:repeat(4,1fr)}}
.big a{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:120px;padding:16px;border-radius:14px;text-decoration:none;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.big a:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big a:nth-child(2){background:var(--gold-soft);border-color:var(--gold)}
.big a:not(:first-child) .ico{stroke:var(--accent-text)}
.big a b{font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.big a span{font-size:.82rem;opacity:.85}
.big .ico{width:30px;height:30px}
.badge{font-family:var(--f-mono);font-size:.78rem;background:var(--brand-red);color:#fff;padding:2px 8px;border-radius:99px;font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:default}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--accent)}
.stat{border-top:3px solid var(--gold)}
.stat .v{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .warn{color:var(--amber);font-size:.78rem}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{
  width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-text);outline-offset:-1px;background:var(--surface)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.btn{min-height:44px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-text);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 -2px 0 var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
button.li,a.li{background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
button.li:hover,a.li:hover{background:var(--sunk)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.li .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--amber-soft);color:var(--amber)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-n{background:var(--sunk);color:var(--muted)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
thead th{background:var(--accent-soft);color:var(--ink)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--amber)}

/* cart lines */
.line{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ctl{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.line .ctl .f>span{font-size:.72rem}
.sumbar{position:sticky;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sumbar .tot{font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.sumbar{box-shadow:0 6px 20px rgba(0,0,0,.18),inset 0 -3px 0 var(--accent)}
.sumbar .btn{border-color:transparent}
.sumbar .btn:not(.pri){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
@media (min-width:900px){.sumbar{bottom:12px}}
.results{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.results:empty{display:none}
.results button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;background:var(--surface);border:0;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--accent-soft)}

/* notices */
.note{padding:10px 12px;border-radius:8px;font-size:.9rem;background:var(--sunk)}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--good-soft);color:var(--good)}

/* modal / sheet */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:16px;padding:22px}}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:1.2rem}

/* receipt paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:20px 18px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);
  font-size:.88rem;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:radial-gradient(circle at 6px 8px,var(--surface) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.paper .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:2px solid #1B1B18;padding-bottom:10px;flex-wrap:wrap}
.paper .ph b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;letter-spacing:.03em}
.paper .doc-t{font-family:var(--f-mono);text-align:right;font-weight:600}
.paper table{font-size:.84rem}
.paper th{color:#555;border-color:#ccc}
.paper td{border-color:#e2e2dc}
.paper .tots{display:flex;flex-direction:column;gap:3px;align-self:flex-end;min-width:200px;font-family:var(--f-mono)}
.paper .tots div{display:flex;justify-content:space-between;gap:20px}
.paper .tots .big{font-weight:600;font-size:1rem;border-top:1px solid #1B1B18;padding-top:4px}
.paper .foot{font-size:.78rem;color:#555;border-top:1px dashed #bbb;padding-top:8px;padding-bottom:6px}


/* documento DISALES (siempre en papel claro) */
.doc{gap:10px;font-size:.82rem;padding:18px 16px 24px;line-height:1.35}
.doc .dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.doc .dlogo{width:40%;max-width:210px;height:auto}
.doc .dt{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end;min-width:0}
.doc .dtit{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,7vw,2.4rem);color:#E8671E;line-height:1}
.doc .dnum{font-weight:700;font-family:var(--f-mono)} .doc .dnum span{color:#D3361C;font-size:1.1em}
.doc .daddr{font-size:.72rem;color:#333}
.doc .dslog{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;border-bottom:2px solid #1B1B18;padding-bottom:4px;font-size:.74rem}
.doc .dslog i{color:#555}
.doc .dcli{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;border-bottom:1px solid #1B1B18;padding-bottom:6px}
.doc .dcli .f{grid-column:1/-1}
.doc .dcli span,.doc .dmeta span,.doc .dlet span{color:#666;font-size:.74rem}
.doc .dmeta{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.doc .bx{display:inline-block;width:16px;height:16px;border:1px solid #1B1B18;text-align:center;line-height:14px;font-style:normal;font-weight:700;vertical-align:middle;margin-right:6px}
.doc .denc{font-weight:700;font-size:.98rem}
.doc .dtab th{background:#EE7B34;color:#1B1B18;border:1px solid #1B1B18;text-transform:none;letter-spacing:0;font-size:.74rem;text-align:center}
.doc .dtab td{border:1px solid #A9A9A2;padding:5px 6px}
.doc .dfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.doc .dpay{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 220px}
.doc .dgr{font-style:italic;font-weight:600}
.doc .dtot{min-width:210px;display:flex;flex-direction:column;gap:3px;margin-left:auto}
.doc .dtot .tl{display:flex;justify-content:space-between;gap:12px;background:#EE7B34;border:1px solid #1B1B18;padding:6px 10px;font-family:var(--f-mono);font-weight:700}
.doc .dtot .te{display:flex;justify-content:space-between;gap:12px;padding:0 10px;font-family:var(--f-mono);font-size:.8rem}
.doc .reg{text-align:right;font-weight:700;padding-right:10px;font-size:.95rem}
.doc .dnote{font-size:.78rem;color:#444}
.doc .dobs{font-size:.74rem;display:flex;flex-direction:column;gap:2px}
.doc .dobs b{font-size:.9rem}
.doc .dsig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px;text-align:center;font-size:.74rem}
.doc .dsig div{display:flex;flex-direction:column;gap:2px}
.doc .dsig .nm{font-weight:600;min-height:1.2em}

<script>
/* ========= utilidades ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,'.'));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const money=n=>'C$ '+(+n||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const qty=n=>(+n||0).toLocaleString('es-NI',{maximumFractionDigits:3});
const hoy=()=>new Date().toLocaleDateString('en-CA');
const dia=iso=>iso?(iso.length===10?iso:new Date(iso).toLocaleDateString('en-CA')):'';
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
const fdate=d=>{if(!d)return'—';const x=new Date(d.length===10?d+'T12:00:00':d);return x.toLocaleDateString('es-NI',{day:'numeric',month:'short',year:'numeric'})};
const fdt=iso=>iso?new Date(iso).toLocaleString('es-NI',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>n==null?'—':String(n).padStart(5,'0');
const UNI={lb:'lb',L:'L',kg:'kg',u:'unid.'};
const UBIC={casa:'Bodega casa',tramo:'Tramo'};
const MEDIO={efectivo:'Efectivo',transferencia:'Transferencia',tarjeta:'Tarjeta'};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const HOLDER='h-'+nid();
const ls={get(k,d){try{const v=localStorage.getItem('disales:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('disales:'+k,JSON.stringify(v))}catch(e){}}};

const IC={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 cart:'<path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/>',
 cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
 truck:'<path d="M2 6h12v10H2z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
 quote:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 docs:'<path d="M7 3h8l4 4v14H7z"/><path d="M4 6v15h11"/>',
 box:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
 buy:'<path d="M4 7h16l-1.5 12h-13z"/><path d="M9 7a3 3 0 016 0"/>',
 register:'<rect x="3" y="10" width="18" height="10" rx="1.5"/><path d="M6 10V5h8v5M16 7h3v3"/><path d="M7 15h2M11 15h2M15 15h2"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>',
 factory:'<path d="M3 20V10l6 3V10l6 3V6h6v14z"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
};
const ico=k=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[k]||''}</svg>`;

/* ========= estado ========= */
const COLS=['productos','clientes','proveedores','ventas','compras','traslados','entregas','devoluciones','pagos','movs','cierres'];
const S={d:{},ready:new Set(),db:null,user:null,uid:null,admin:false,write:null,names:{},pending:false,err:null,nodb:false,
  cart:ls.get('cart',null),compra:null,tras:null,cobro:{cliId:null,monto:'',medio:'efectivo',apl:{},nota:''},
  rp:{p:'mes',a:'',b:''},docTab:'facturas',docQ:'',cajaDia:hoy(),saving:false};
COLS.forEach(c=>S.d[c]=[]);
S.aj={};
let ver=0,Dc=null,Dv=-1;

/* ========= derivados (todo sale de registrar cada operación una vez) ========= */
function D(){
  if(Dv===ver)return Dc;
  const d={};
  d.prod=new Map(S.d.productos.map(p=>[p.id,p]));
  d.cli=new Map(S.d.clientes.map(c=>[c.id,c]));
  d.prov=new Map(S.d.proveedores.map(c=>[c.id,c]));
  d.ven=new Map(S.d.ventas.map(v=>[v.id,v]));
  d.entregado={};
  S.d.entregas.forEach(e=>{const a=d.entregado[e.ventaId]||(d.entregado[e.ventaId]=[]);(e.lineas||[]).forEach(x=>a[x.i]=(a[x.i]||0)+num(x.base))});
  d.cancelado={};d.devuelto={};d.credito={};d.devCosto={};
  S.d.devoluciones.forEach(dv=>{
    d.credito[dv.ventaId]=(d.credito[dv.ventaId]||0)+num(dv.credito);
    (dv.lineas||[]).forEach(x=>{const key=x.pendiente?'cancelado':'devuelto';const a=d[key][dv.ventaId]||(d[key][dv.ventaId]=[]);a[x.i]=(a[x.i]||0)+num(x.base)});
  });
  d.abonos={};
  S.d.pagos.forEach(p=>{if((p.tipo==='cobro'||p.tipo==='aplicaFavor')&&p.estado!=='anulado')(p.aplicaciones||[]).forEach(a=>d.abonos[a.ventaId]=(d.abonos[a.ventaId]||0)+num(a.monto))});
  const L=[];
  S.d.movs.forEach(m=>{if(Array.isArray(m.lineas))m.lineas.forEach(x=>L.push({pid:x.pid,ubic:x.ubic,q:num(x.q),fecha:m.fecha,tipo:m.tipo,nota:m.nota,por:m.por}));else L.push({pid:m.pid,ubic:m.ubic,q:num(m.q),fecha:m.fecha,tipo:m.tipo,nota:m.nota,por:m.por})});
  S.d.compras.forEach(c=>{if(c.apertura)return;(c.lineas||[]).forEach(l=>L.push({pid:l.pid,ubic:c.ubic||'casa',q:num(l.base),fecha:c.fecha,tipo:'Compra',nota:provName(c.provId,d),por:c.por}))});
  S.d.traslados.forEach(t=>(t.lineas||[]).forEach(l=>{L.push({pid:l.pid,ubic:t.desde,q:-num(l.base),fecha:t.fecha,tipo:'Traslado',nota:'hacia '+UBIC[t.hacia],por:t.por});L.push({pid:l.pid,ubic:t.hacia,q:num(l.base),fecha:t.fecha,tipo:'Traslado',nota:'desde '+UBIC[t.desde],por:t.por})}));
  S.d.ventas.forEach(v=>{if(v.tipo!=='factura'||v.entrega!=='ahora')return;(v.lineas||[]).forEach(l=>l.pid&&L.push({pid:l.pid,ubic:v.ubic,q:-num(l.base),fecha:v.fecha,tipo:'Venta',nota:'Factura '+pad(v.num),ventaId:v.id,por:v.por}))});
  S.d.entregas.forEach(e=>{const v=d.ven.get(e.ventaId);if(!v)return;(e.lineas||[]).forEach(x=>{const l=v.lineas[x.i];if(l&&l.pid)L.push({pid:l.pid,ubic:v.ubic,q:-num(x.base),fecha:e.fecha,tipo:'Entrega',nota:'Factura '+pad(v.num),ventaId:v.id,por:e.por})})});
  // factura anulada: lo que salió del inventario (venta inmediata o entregas) regresa en la fecha de anulación
  S.d.ventas.forEach(v=>{if(v.tipo!=='factura'||v.estado!=='anulada')return;const en=d.entregado[v.id]||[];
    (v.lineas||[]).forEach((l,i)=>{if(!l.pid)return;const q=v.entrega==='ahora'?num(l.base):(en[i]||0);if(q>0)L.push({pid:l.pid,ubic:v.ubic,q,fecha:v.anulaFecha||v.fecha,tipo:'Anulación',nota:'Factura '+pad(v.num)+' anulada',ventaId:v.id,por:v.anulaPor})})});
  S.d.devoluciones.forEach(dv=>(dv.lineas||[]).forEach(x=>{if(x.regresa&&!x.pendiente&&x.pid){const v=d.ven.get(dv.ventaId);L.push({pid:x.pid,ubic:dv.ubic,q:num(x.base),fecha:dv.fecha,tipo:'Devolución',nota:v?'Factura '+pad(v.num):'',ventaId:dv.ventaId,por:dv.por})}}));
  L.sort((a,b)=>(a.fecha||'')<(b.fecha||'')?1:-1);
  d.L=L;
  d.stock={};L.forEach(m=>{const k=m.pid+'|'+m.ubic;d.stock[k]=(d.stock[k]||0)+m.q});
  d.res={};
  S.d.ventas.forEach(v=>{if(v.tipo!=='factura'||v.entrega!=='despues'||v.estado==='anulada')return;const en=d.entregado[v.id]||[],ca=d.cancelado[v.id]||[];
    (v.lineas||[]).forEach((l,i)=>{const p=num(l.base)-(en[i]||0)-(ca[i]||0);if(p>1e-9&&l.pid){const k=l.pid+'|'+v.ubic;d.res[k]=(d.res[k]||0)+p}})});
  d.saldo={};
  S.d.ventas.forEach(v=>{if(v.tipo!=='factura')return;
    // anulada: no se debe nada; si el pago se dejó a favor del cliente, queda como saldo negativo
    if(v.estado==='anulada'){if(v.anulaFavor)d.saldo[v.id]=r2(-num(v.pagoInicial&&v.pagoInicial.monto)-(d.abonos[v.id]||0));return}
    d.saldo[v.id]=r2(num(v.total)-num(v.pagoInicial&&v.pagoInicial.monto)-(d.abonos[v.id]||0)-(d.credito[v.id]||0))});
  d.deudaProv={};d.deudaTarjeta=0;
  S.d.compras.forEach(c=>{if(c.pago==='credito')d.deudaProv[c.provId]=(d.deudaProv[c.provId]||0)+num(c.total);else if(c.pago==='tarjeta')d.deudaTarjeta+=num(c.total)});
  S.d.pagos.forEach(p=>{if(p.tipo==='pagoProv')d.deudaProv[p.provId]=(d.deudaProv[p.provId]||0)-num(p.monto);if(p.tipo==='pagoTarjeta')d.deudaTarjeta-=num(p.monto)});
  Dc=d;Dv=ver;return d;
}
const stockOf=(pid,u)=>r3(D().stock[pid+'|'+u]||0);
const resOf=(pid,u)=>r3(D().res[pid+'|'+u]||0);
const dispOf=(pid,u)=>r3(stockOf(pid,u)-resOf(pid,u));
const cliName=id=>id?(D().cli.get(id)?.nombre||'Cliente eliminado'):'Cliente de contado';
function provName(id,d){d=d||D();return id?(d.prov.get(id)?.nombre||'Proveedor'):'—'}
const pendLinea=(v,i)=>{const d=D();return r3(num(v.lineas[i].base)-((d.entregado[v.id]||[])[i]||0)-((d.cancelado[v.id]||[])[i]||0))};
const vigente=v=>v.tipo==='factura'&&v.estado!=='anulada';
const pedidoPendiente=v=>vigente(v)&&v.entrega==='despues'&&(v.lineas||[]).some((l,i)=>pendLinea(v,i)>1e-9);
function estadoFactura(v){
  const s=D().saldo[v.id]||0;
  if(v.estado==='anulada')return s<-0.004?['Anulada · saldo a favor','p-bad']:['Anulada','p-bad'];
  if(s<=0.004)return s<-0.004?['A favor del cliente','p-n']:['Pagada','p-ok'];
  if(v.vence&&v.vence<hoy())return['Vencida','p-bad'];
  return['Pendiente','p-warn'];
}
function pres(p,pi){return (p&&p.presentaciones&&p.presentaciones[pi])||{nombre:UNI[p?.unidad]||'unid.',factor:1,precio:0}}

/* flujos de dinero */
function flujos(){
  const F=[],d=D();
  S.d.ventas.forEach(v=>{if(v.tipo==='factura'&&!v.apertura&&num(v.pagoInicial&&v.pagoInicial.monto)>0){
    F.push({fecha:v.fecha,monto:num(v.pagoInicial.monto),medio:v.pagoInicial.medio||'efectivo',tipo:'venta',txt:'Pago en venta · Factura '+pad(v.num),sub:cliName(v.cliId),por:v.por});
    if(v.estado==='anulada'&&!v.anulaFavor)F.push({fecha:v.anulaFecha||v.fecha,monto:-num(v.pagoInicial.monto),medio:v.pagoInicial.medio||'efectivo',tipo:'anulacion',txt:'Dinero devuelto · Factura '+pad(v.num)+' anulada',sub:cliName(v.cliId),por:v.anulaPor})}});
  S.d.pagos.forEach(p=>{
    const m=num(p.monto),base={fecha:p.fecha,medio:p.medio||'efectivo',por:p.por,id:p.id};
    if(p.tipo==='cobro'){F.push({...base,monto:m,tipo:'cobro',txt:'Cobro · Recibo '+pad(p.num),sub:cliName(p.cliId)});
      if(p.estado==='anulado')F.push({...base,fecha:p.anulaFecha||p.fecha,por:p.anulaPor,monto:-m,tipo:'anulacion',txt:'Anulación · Recibo '+pad(p.num),sub:cliName(p.cliId)})}
    else if(p.tipo==='gasto')F.push({...base,monto:-m,tipo:'gasto',txt:'Gasto · '+(p.categoria||'Otro'),sub:p.nota||(p.ventaId&&d.ven.get(p.ventaId)?'Factura '+pad(d.ven.get(p.ventaId).num):'')});
    else if(p.tipo==='pagoProv')F.push({...base,monto:-m,tipo:'pagoProv',txt:'Pago a proveedor',sub:provName(p.provId)});
    else if(p.tipo==='pagoTarjeta')F.push({...base,monto:-m,tipo:'pagoTarjeta',txt:'Pago de tarjeta del negocio',sub:p.nota||''});
    else if(p.tipo==='entrada')F.push({...base,monto:m,tipo:'entrada',txt:'Entrada de efectivo',sub:p.nota||''});
    else if(p.tipo==='salida')F.push({...base,monto:-m,tipo:'salida',txt:'Salida de efectivo',sub:p.nota||''});
  });
  S.d.compras.forEach(c=>{if(c.apertura)return;
    if(c.pago==='contado')F.push({fecha:c.fecha,monto:-num(c.total),medio:c.medio||'efectivo',tipo:'compra',txt:'Compra de contado',sub:provName(c.provId),por:c.por});
    if(num(c.transporte)>0)F.push({fecha:c.fecha,monto:-num(c.transporte),medio:c.medioT||'efectivo',tipo:'gasto',txt:'Gasto · Transporte de compra',sub:provName(c.provId),por:c.por});
  });
  S.d.devoluciones.forEach(dv=>{if(num(dv.reembolso)>0)F.push({fecha:dv.fecha,monto:-num(dv.reembolso),medio:'efectivo',tipo:'reembolso',txt:'Reembolso por devolución',sub:'',por:dv.por})});
  return F.sort((a,b)=>(a.fecha||'')<(b.fecha||'')?1:-1);
}

/* ========= escritura segura ========= */
const ERR={invalid_argument:'No tenés permiso para guardar aquí, o un dato no es válido.',quota_exceeded:'Se llenó el espacio de datos. Avisale al administrador.',resource_exhausted:'Demasiadas operaciones seguidas. Esperá unos segundos e intentá de nuevo.',unavailable:'Sin conexión con el servidor. Revisá el internet e intentá de nuevo.',revoked:'Se cerró el acceso a los datos. Recargá la página.',busy:'Otra persona está guardando al mismo tiempo. Intentá de nuevo.'};
const errMsg=e=>ERR[e&&e.code]||('No se pudo guardar: '+((e&&e.message)||'error desconocido'));
async function put(path,data,merge){
  if(!S.db)throw{code:'unavailable'};
  const ref=S.db.doc(path);
  try{return merge?await ref.update(data):await ref.set(data)}
  catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*600);return merge?await ref.update(data):await ref.set(data)}throw e}
}
async function del(path){await S.db.doc(path).delete()}
async function nextNum(kind){
  if(S.db.nextSeq)return S.db.nextSeq(kind); // versión independiente: transacción del servidor
  const ref=S.db.doc('seq/'+kind);
  for(let i=0;i<10;i++){
    const r=await ref.acquire({holder:HOLDER,ttlMs:6000});
    if(r.acquired){const s=await ref.get();const n=((s.exists&&num(s.data().n))||0)+1;await ref.set({n});return n}
    await sleep(400+Math.random()*500);
  }
  throw{code:'busy'};
}
const stamp=()=>({fecha:new Date().toISOString(),por:S.uid||null});

/* ========= UI base ========= */
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,bad?6000:3200)}
function openModal(html){if(html)S.modalRender=null;const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;document.body.style.overflow='hidden';const f=m.querySelector('input,select,textarea');if(f&&window.innerWidth>700)f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.style.overflow='';S.modalRender=null}
function sheetH(t){return `<div class="sheet-h"><h2>${t}</h2><button class="x" data-a="close" aria-label="Cerrar">×</button></div>`}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const NAV=[
 ['inicio','Inicio','home'],['vender','Vender','cart'],['cobrar','Cobrar','cash'],['pedidos','Pedidos','truck'],
 ['documentos','Documentos','docs'],['inventario','Inventario','box'],['compras','Compras','buy'],['caja','Caja y gastos','register'],
 ['reportes','Reportes','chart'],['actividad','Actividad','clock'],['clientes','Clientes','users'],['proveedores','Proveedores','factory'],['catalogo','Catálogo','tag'],['ajustes','Ajustes','gear']];
const route=()=>{const h=(location.hash||'').slice(1);return NAV.some(n=>n[0]===h)?h:'inicio'};

function renderChrome(){
  const r=route();
  const nPed=S.d.ventas.filter(pedidoPendiente).length;
  $('#side').innerHTML=NAV.map((n,i)=>(i===4?'<div class="grp lbl">Control</div>':i===10?'<div class="grp lbl">Datos</div>':'')+`<a href="#${n[0]}" class="${r===n[0]?'on':''}">${ico(n[2])}${n[1]}${n[0]==='pedidos'&&nPed?` <span class="badge">${nPed}</span>`:''}</a>`).join('');
  const main=['inicio','vender','cobrar','pedidos'];
  $('#tabs').innerHTML=NAV.slice(0,4).map(n=>`<a href="#${n[0]}" class="${r===n[0]?'on':''}">${ico(n[2])}${n[1]}</a>`).join('')+`<button data-a="more" class="${main.includes(r)?'':'on'}">${ico('more')}Más</button>`;
  $('#bizName').textContent=S.aj.nombre||'DISALES';
  const br=$('.brand');if(!br.querySelector('img')){const im=new Image();im.className='logo';im.alt=S.aj.nombre||'DISALES';im.src=LOGO;br.prepend(im)}
  const sy=$('#sync');
  if(S.nodb)sy.innerHTML='<span class="dot off"></span>Sin datos compartidos';
  else if(S.err)sy.innerHTML='<span class="dot off"></span>Sin conexión';
  else if(S.ready.size<COLS.length)sy.innerHTML='<span class="dot wait"></span>Cargando…';
  else if(S.pending)sy.innerHTML='<span class="dot wait"></span>Guardando…';
  else sy.innerHTML='<span class="dot"></span>Al día';
}
let rq=false,deferred=false;
function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;
  const a=document.activeElement;
  if(a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){deferred=true;renderChrome();return}
  render();
  if(S.modalRender&&!(a&&$('#modal').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))S.modalRender();
})}
document.addEventListener('focusout',()=>{if(deferred){setTimeout(()=>{const a=document.activeElement;if(!(a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){deferred=false;render()}},50)}});
function render(){
  renderChrome();
  const r=route();
  const V={inicio:vInicio,vender:vVender,cobrar:vCobrar,pedidos:vPedidos,documentos:vDocumentos,inventario:vInventario,compras:vCompras,caja:vCaja,reportes:vReportes,actividad:vActividad,clientes:vClientes,proveedores:vProveedores,catalogo:vCatalogo,ajustes:vAjustes};
  let h='';
  if(S.nodb)h=`<div class="page"><div class="card"><h2>Esta vista no tiene acceso a los datos del negocio</h2><p class="muted">${window.DISALES_FB?'Entrá con una cuenta de Google autorizada. Si tu correo no está autorizado, pedile al administrador que lo agregue.':'Abrí DISALES desde claude.ai con tu cuenta iniciada. Si te compartieron el enlace, pedile al administrador que te dé acceso como Colaborador.'}</p></div></div>`;
  else h=(S.write===false?`<div class="page" style="margin-bottom:12px"><div class="note warn">Tenés acceso de solo lectura. Para registrar ventas o cobros, pedí acceso de Colaborador.</div></div>`:'')+V[r]();
  $('#main').innerHTML=h;
  if(V[r]===vVender){paintCli();paintProd('cart')}
  if(r==='compras'&&S.compra)paintProd('compra');
  if(r==='cobrar'&&!S.cobro.cliId)paintCobroCli();
  refreshNames();
}
window.addEventListener('hashchange',()=>{closeModal();window.scrollTo(0,0);render()});

/* nombres de quien registró */
let namesBusy=false;
async function refreshNames(){
  if(!S.user||namesBusy)return;
  const ids=new Set();COLS.forEach(c=>S.d[c].forEach(x=>{if(x.por)ids.add(x.por)}));if(S.uid)ids.add(S.uid);
  const need=[...ids].filter(i=>!(i in S.names));if(!need.length)return;
  namesBusy=true;
  try{const ps=await S.user.profiles([...ids]);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||'';if(S.names[id]!==n){S.names[id]=n;ch=true}}
    if(S.uid&&ps[S.uid]){if(ps[S.uid].avatarUrl)$('#me').innerHTML=`<img alt="" referrerpolicy="no-referrer" src="${esc(ps[S.uid].avatarUrl)}">`;$('#meName').textContent=ps[S.uid].name||''}
    if(ch)schedule();}catch(e){}
  namesBusy=false;
}
const who=id=>id?(S.names[id]||'Usuario'):'Carga inicial';

/* ========= INICIO ========= */
function vInicio(){
  const t=hoy(),F=flujos().filter(f=>dia(f.fecha)===t);
  const ventasHoy=S.d.ventas.filter(v=>vigente(v)&&!v.apertura&&dia(v.fecha)===t);
  const vt=ventasHoy.reduce((s,v)=>s+num(v.total),0);
  const recibido=F.filter(f=>f.monto>0).reduce((s,f)=>s+f.monto,0);
  const ef=F.filter(f=>f.medio==='efectivo').reduce((s,f)=>s+f.monto,0);
  const nPed=S.d.ventas.filter(pedidoPendiente).length;
  const venc=S.d.ventas.filter(v=>v.tipo==='factura'&&estadoFactura(v)[0]==='Vencida');
  const low=S.d.productos.filter(p=>num(p.minimo)>0&&(stockOf(p.id,'casa')+stockOf(p.id,'tramo')-resOf(p.id,'casa')-resOf(p.id,'tramo'))<num(p.minimo));
  const recent=[...S.d.ventas.filter(v=>v.tipo==='factura'&&!v.apertura&&!v.sinUso)].sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,6);
  const empty=!S.d.productos.length;
  return `<div class="page">
  ${empty&&S.ready.has('productos')?`<div class="note warn">Todavía no hay productos en el catálogo. Empezá en <a href="#catalogo">Catálogo</a> y luego cargá existencias y saldos en <a href="#ajustes">Ajustes</a>.</div>`:''}
  ${S.uid?`<div class="small muted">Hola${S.names[S.uid]?', <b style="color:var(--ink)">'+esc(S.names[S.uid].split(' ')[0])+'</b>':''}. Lo que registres queda a tu nombre.</div>`:''}
  <div class="big">
    <a href="#vender" data-a="goVender">${ico('cart')}<div><b>Vender</b><br><span>Factura de contado o crédito</span></div></a>
    <a href="#cobrar">${ico('cash')}<div><b>Cobrar</b><br><span>Abonos y saldos</span></div></a>
    <a href="#vender" data-a="goCotizar">${ico('quote')}<div><b>Cotizar</b><br><span>Sin mover inventario</span></div></a>
    <a href="#pedidos">${ico('truck')}<div><b>Pedidos</b> ${nPed?`<span class="badge">${nPed}</span>`:''}<br><span>Por preparar y entregar</span></div></a>
  </div>
  <div><div class="lbl" style="margin-bottom:8px">Hoy, ${fdate(t)}</div>
  <div class="stats">
    <div class="stat"><span class="lbl">Vendido</span><span class="v">${money(vt)}</span><span class="small muted">${ventasHoy.length} factura${ventasHoy.length===1?'':'s'}</span></div>
    <div class="stat"><span class="lbl">Dinero recibido</span><span class="v">${money(recibido)}</span><span class="small muted">ventas y abonos</span></div>
    <div class="stat"><span class="lbl">Efectivo del día</span><span class="v">${money(ef)}</span><span class="small muted">sin fondo inicial</span></div>
  </div></div>
  ${(venc.length||low.length)?`<div class="grid2">
    ${venc.length?`<a class="card" href="#reportes" style="text-decoration:none;color:inherit"><div class="card-h"><h3>Facturas vencidas</h3><span class="pill p-bad">${venc.length}</span></div><div class="small muted">Saldo vencido ${money(venc.reduce((s,v)=>s+D().saldo[v.id],0))}</div></a>`:''}
    ${low.length?`<a class="card" href="#inventario" style="text-decoration:none;color:inherit"><div class="card-h"><h3>Poco inventario</h3><span class="pill p-warn">${low.length}</span></div><div class="small muted">${low.slice(0,4).map(p=>esc(p.nombre)).join(', ')}${low.length>4?'…':''}</div></a>`:''}
  </div>`:''}
  <div class="card"><div class="card-h"><h2>Últimas ventas</h2><a class="btn ghost sm" href="#documentos">Ver todas</a></div>
    ${recent.length?`<div class="list">${recent.map(liVenta).join('')}</div>`:`<div class="empty">Las facturas que confirmen aparecerán aquí.</div>`}
  </div></div>`;
}
function liVenta(v){
  const [e,c]=v.tipo==='cotizacion'?(v.estado==='convertida'?['Convertida','p-ok']:v.estado==='anulada'?['Anulada','p-bad']:['Abierta','p-n']):estadoFactura(v);
  const ped=pedidoPendiente(v);
  return `<button class="li" data-a="openVenta" data-id="${v.id}"><div class="grow"><div class="t">${v.apertura?'Saldo de apertura':(v.tipo==='cotizacion'?'Cotización ':'Factura ')+pad(v.num)} · ${esc(cliName(v.cliId))}</div><div class="s">${fdt(v.fecha)}${v.ubic?' · '+UBIC[v.ubic]:''}${ped?' · por entregar':''} · ${esc(who(v.por))}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="amt">${money(v.total)}</span><span class="pill ${c}">${e}</span></div></button>`;
}

/* ========= VENDER / COTIZAR ========= */
function newCart(modo){S.cart={id:nid(),modo:modo||'venta',cliId:null,cliSet:false,lineas:[],desdeCot:null,num:null,fecha:null};saveCart()}
function saveCart(){ls.set('cart',S.cart)}
/* Si un carrito ya recibió número pero no se guardó (falló y se abandonó, o cambió de factura a cotización),
   el número queda registrado como "anulado sin usar": así la numeración nunca tiene huecos sin explicación. */
async function liberarNum(c){
  if(!c||!c.num||D().ven.get(c.id))return;
  const kind=c.numKind||(c.modo==='cotizacion'?'cotizacion':'factura'),ahora=new Date().toISOString();
  try{await put('ventas/'+c.id,{tipo:kind,estado:'anulada',sinUso:true,num:c.num,fecha:c.fecha||ahora,por:S.uid||null,cliId:null,lineas:[],total:0,anulaPor:S.uid||null,anulaFecha:ahora,anulaMotivo:'Número no utilizado: el documento no se terminó de guardar'})}catch(e){}
  c.id=nid();c.num=null;c.fecha=null;c.numKind=null;if(c===S.cart)saveCart();
}
function vVender(){
  if(!S.cart)newCart('venta');
  if(S.ready.has('productos'))S.cart.lineas=S.cart.lineas.filter(l=>l.libre||D().prod.get(l.pid));
  const c=S.cart,cot=c.modo==='cotizacion',cli=c.cliId?D().cli.get(c.cliId):null;
  const tot=cartTotal();
  return `<div class="page">
  <div class="page-h"><h1>${cot?'Cotizar':'Vender'}</h1>
    <div class="seg" role="tablist"><button data-a="modo" data-v="venta" class="${!cot?'on':''}">Venta</button><button data-a="modo" data-v="cotizacion" class="${cot?'on':''}">Cotización</button></div></div>
  ${c.desdeCot?`<div class="note">Convirtiendo la cotización ${pad(D().ven.get(c.desdeCot)?.num)} en pedido. Revisá cantidades y precios antes de confirmar.</div>`:''}
  <div class="card"><div class="card-h"><h2>Cliente</h2>${c.cliSet?`<button class="btn ghost sm" data-a="cliClear">Cambiar</button>`:''}</div>
   ${c.cliSet?`<div class="li" style="padding:0"><div class="grow"><div class="t">${esc(cli?cli.nombre:'Cliente de contado')}</div><div class="s">${cli?esc(cli.telefono||'Sin teléfono')+(saldoCliente(cli.id)>0?' · debe '+money(saldoCliente(cli.id)):''):'Venta sin cuenta de cliente'}</div></div></div>`
   :`<input type="search" id="cliQ" placeholder="Buscar por nombre o teléfono" autocomplete="off"><div class="results" id="cliRes"></div>
     <div class="row"><button class="btn sm" data-a="cliContado">Cliente de contado</button><button class="btn ghost sm" data-a="cliNew">+ Nuevo cliente</button></div>`}
  </div>
  <div class="card"><h2>Productos</h2>
   <input type="search" id="prodQ" data-k="cart" placeholder="Buscar producto por nombre o código" autocomplete="off"><div class="results" id="prodRes"></div>
   <div id="lines">${linesHtml('cart')}</div>
   <button class="btn ghost sm" data-a="addLibre" style="align-self:flex-start">+ Artículo libre (fuera del catálogo)</button>
  </div>
  ${cot?`<div class="card"><label class="f"><span>Título o descripción de la cotización (opcional)</span><input type="text" id="cartTit" value="${esc(c.titulo||'')}" placeholder="Ej.: Canasta básica empacada con celofán y moño rojo, valor C$ 2,000"></label></div>`:''}
  <div class="sumbar"><div><div class="lbl" style="color:inherit;opacity:.7">Total</div><div class="tot" id="cartTotal">${money(tot)}</div></div><div class="spacer"></div>
   ${c.lineas.length?`<button class="btn sm" data-a="cartClear">Vaciar</button>`:''}
   ${cot?`<button class="btn pri" data-a="saveCot" ${c.lineas.length?'':'disabled'}>Guardar cotización</button>`
   :`<button class="btn" data-a="cartToCot" ${c.lineas.length?'':'disabled'}>Guardar como cotización</button><button class="btn pri" data-a="confirmOpen" ${c.lineas.length?'':'disabled'}>Confirmar venta</button>`}
  </div></div>`;
}
function saldoCliente(id){const d=D();return r2(S.d.ventas.filter(v=>v.tipo==='factura'&&v.cliId===id).reduce((s,v)=>s+Math.max(0,d.saldo[v.id]||0),0))}
function porPeso(l){if(l.libre)return false;const x=pres(D().prod.get(l.pid),l.pi);return !!(x.variable&&x.porPeso)}
function lineSub(l){return porPeso(l)?num(l.base)*num(l.precio):num(l.cant)*num(l.precio)}
function cartTotal(){return r2(S.cart.lineas.reduce((s,l)=>s+lineSub(l),0))}
function paintCli(){const el=$('#cliRes'),q=$('#cliQ');if(!el||!q)return;const s=norm(q.value).trim();
  if(!s){el.innerHTML='';return}
  const r=S.d.clientes.filter(c=>norm(c.nombre).includes(s)||String(c.telefono||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')||'#')).slice(0,12);
  el.innerHTML=r.length?r.map(c=>`<button data-a="cliPick" data-id="${c.id}"><div class="grow" style="flex:1"><div class="t">${esc(c.nombre)}</div><div class="s small muted">${esc(c.telefono||'')}${saldoCliente(c.id)>0?' · debe '+money(saldoCliente(c.id)):''}</div></div></button>`).join(''):`<button data-a="cliNew" data-name="${esc(q.value)}"><span>Crear cliente “${esc(q.value)}”</span></button>`;
}
function paintProd(k){const el=$('#prodRes'),q=$('#prodQ');if(!el||!q)return;const s=norm(q.value).trim();
  if(!s){el.innerHTML='';return}
  const out=[];
  S.d.productos.forEach(p=>{(p.presentaciones||[]).forEach((pr,pi)=>{
    const nm=norm(p.nombre+' '+pr.nombre);if(s.split(/\s+/).every(w=>nm.includes(w))||norm(pr.codigo)===s||norm(pr.codigo).startsWith(s))out.push([p,pr,pi]);
  })});
  el.innerHTML=out.slice(0,30).map(([p,pr,pi])=>`<button data-a="addLine" data-k="${k}" data-pid="${p.id}" data-pi="${pi}"><div style="flex:1;min-width:0"><div class="t">${esc(p.nombre)} · ${esc(pr.nombre)}</div><div class="small muted">${pr.codigo?esc(pr.codigo)+' · ':''}Casa ${qty(dispOf(p.id,'casa'))} · Tramo ${qty(dispOf(p.id,'tramo'))} ${UNI[p.unidad]||''}</div></div><span class="num">${k==='cart'?money(pr.precio):''}</span></button>`).join('')||`<div class="empty small">Sin resultados. Agregá el producto en <a href="#catalogo">Catálogo</a>.</div>`;
}
function linesOf(k){return k==='cart'?S.cart.lineas:k==='compra'?S.compra.lineas:S.tras.lineas}
function linesHtml(k){
  const L=linesOf(k);
  if(!L.length)return `<div class="empty small">${k==='cart'?'Buscá productos para agregarlos al carrito.':'Agregá productos con el buscador.'}</div>`;
  return L.map((l,i)=>{
    if(l.libre)return `<div class="line"><div><div class="t" style="font-weight:600">${esc(l.desc||'Artículo libre')}</div><div class="small muted">No mueve inventario${num(l.precio)<=0?' · <span class="pill p-warn">Sin precio</span>':''}</div></div>
    <div style="display:flex;gap:6px;align-items:flex-start"><span class="num" id="st-${k}-${i}" style="font-weight:600">${money(lineSub(l))}</span><button class="btn ghost sm danger" data-a="rmLine" data-k="${k}" data-i="${i}">Quitar</button></div>
    <div class="ctl"><label class="f" style="grid-column:1/-1"><span>Descripción</span><input type="text" value="${esc(l.desc)}" data-k="${k}" data-l="${i}" data-f="desc" placeholder="Ej.: Arroz 2 kilos Tío Pelón"></label>
      <label class="f"><span>Unidad</span><input type="text" value="${esc(l.pres)}" data-k="${k}" data-l="${i}" data-f="pres" placeholder="Bolsa"></label>
      <label class="f"><span>Cantidad</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.cant)}" data-k="${k}" data-l="${i}" data-f="cant"></label>
      <label class="f"><span>Precio c/u (C$)</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.precio)}" data-k="${k}" data-l="${i}" data-f="precio"></label>
      <label class="f"><span>Costo c/u (interno)</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.costo)}" data-k="${k}" data-l="${i}" data-f="costo" placeholder="opcional"></label></div></div>`;
    const p=D().prod.get(l.pid);if(!p)return'';const pr=pres(p,l.pi);const u=UNI[p.unidad]||'';
    const sub=k==='cart'?lineSub(l):k==='compra'?num(l.costo):null;
    return `<div class="line"><div><div class="t" style="font-weight:600">${esc(p.nombre)}</div><div class="small muted">${k==='cart'&&num(l.precio)<=0?'<span class="pill p-warn">Sin precio</span> ':''}${k==='cart'&&l.ult?'<span class="pill p-n">Último precio al cliente</span> ':''}${k==='cart'&&num(l.precio)!==num(pr.precio)&&num(pr.precio)>0?'Catálogo '+money(pr.precio)+' · ':''}${pr.variable?'Peso real: '+qty(l.base)+' '+u:'= '+qty(l.base)+' '+u}${k!=='compra'?' · disponible '+UBIC.casa.split(' ')[1]+' '+qty(dispOf(p.id,'casa'))+', tramo '+qty(dispOf(p.id,'tramo')):''}</div></div>
    <div style="display:flex;gap:6px;align-items:flex-start">${sub!=null?`<span class="num" id="st-${k}-${i}" style="font-weight:600">${money(sub)}</span>`:''}<button class="btn ghost sm danger" data-a="rmLine" data-k="${k}" data-i="${i}" aria-label="Quitar">Quitar</button></div>
    <div class="ctl">
      <label class="f"><span>Presentación</span><select data-k="${k}" data-l="${i}" data-f="pi">${(p.presentaciones||[]).map((x,j)=>`<option value="${j}" ${j==l.pi?'selected':''}>${esc(x.nombre)}${x.variable?'':' ('+qty(x.factor)+' '+u+')'}</option>`).join('')}</select></label>
      <label class="f"><span>Cantidad${pr.variable?' ('+esc(pr.nombre).toLowerCase()+'s)':''}</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.cant)}" data-k="${k}" data-l="${i}" data-f="cant"></label>
      ${pr.variable?`<label class="f"><span>Peso real (${u})</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.base)}" data-k="${k}" data-l="${i}" data-f="base"></label>`:''}
      ${k==='cart'?`<label class="f"><span>${pr.variable&&pr.porPeso?'Precio por '+u:'Precio c/u'} (C$)</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.precio)}" data-k="${k}" data-l="${i}" data-f="precio"></label>`:''}
      ${k==='compra'?`<label class="f"><span>Costo total línea (C$)</span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(l.costo)}" data-k="${k}" data-l="${i}" data-f="costo"></label>`:''}
    </div></div>`}).join('');
}
function recalcLine(l){if(l.libre){l.base=num(l.cant);return}const p=D().prod.get(l.pid);const pr=pres(p,l.pi);if(!pr.variable)l.base=r3(num(l.cant)*num(pr.factor))}
function ultimoPrecio(cliId,pid,presN){if(!cliId)return null;let best=null;
  S.d.ventas.forEach(v=>{if(v.cliId!==cliId||v.estado==='anulada')return;(v.lineas||[]).forEach(l=>{if(l.pid===pid&&l.pres===presN&&num(l.precio)>0&&(!best||v.fecha>best.f))best={f:v.fecha,p:num(l.precio)}})});
  return best?best.p:null}
function addLine(k,pid,pi){
  const p=D().prod.get(pid);const pr=pres(p,pi);
  const l={pid,pi:+pi,cant:1,base:pr.variable?'':num(pr.factor)};
  if(k==='cart'){l.precio=num(pr.precio);const lp=ultimoPrecio(S.cart.cliId,pid,pr.nombre);if(lp!=null){l.precio=lp;l.ult=true}}
  if(k==='compra')l.costo=p.costo!=null&&p.costo!==''&&!pr.variable?r2(num(p.costo)*num(pr.factor)):'';
  linesOf(k).push(l);if(k==='cart')saveCart();
  const q=$('#prodQ');if(q){q.value='';}
  if(k==='cart'||k==='compra'){render();const nq=$('#prodQ');}else if(S.modalRender)S.modalRender();
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cliQ')return paintCli();
  if(t.id==='prodQ')return paintProd(t.dataset.k||'cart');
  if(t.id==='cobroCliQ')return paintCobroCli();
  if(t.id==='cartTit'){S.cart.titulo=t.value;saveCart();return}
  if(t.dataset.cnt){const v=S.conteo.v[t.dataset.cnt]||(S.conteo.v[t.dataset.cnt]={});v[t.dataset.u]=t.value;const n=$('#cntN');if(n)n.textContent=conteoCambios().length;return}
  if(t.id==='cntQ'){S.conteo.q=t.value;clearTimeout(S.cntT);S.cntT=setTimeout(()=>{render();const i=$('#cntQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250);return}
  if(t.id==='catQ'){S.catQ=t.value;clearTimeout(S.catT);S.catT=setTimeout(()=>{render();const i=$('#catQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250);return}
  if(t.dataset.l!=null&&t.dataset.f&&t.dataset.f!=='pi'){
    const k=t.dataset.k,l=linesOf(k)[+t.dataset.l];if(!l)return;l[t.dataset.f]=t.value;recalcLine(l);
    if(k==='cart'){saveCart();const st=$(`#st-cart-${t.dataset.l}`);if(st)st.textContent=money(lineSub(l));const ct=$('#cartTotal');if(ct)ct.textContent=money(cartTotal())}
    if(k==='compra'){const st=$(`#st-compra-${t.dataset.l}`);if(st)st.textContent=money(num(l.costo));const ct=$('#compraTotal');if(ct)ct.textContent=money(compraTotal())}
  }
  if(t.dataset.cob)cobroInput(t);
  if(t.closest('#confirmForm'))paintConfirm();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.l!=null&&t.dataset.f){const k=t.dataset.k,l=linesOf(k)[+t.dataset.l];if(!l)return;
    if(t.dataset.f==='pi'){l.pi=+t.value;const p=D().prod.get(l.pid),pr=pres(p,l.pi);if(k==='cart')l.precio=num(pr.precio);if(pr.variable)l.base='';if(k==='compra'&&p.costo!=null&&!pr.variable)l.costo=r2(num(p.costo)*num(pr.factor)*num(l.cant))}
    else l[t.dataset.f]=t.value;
    recalcLine(l);if(k==='cart')saveCart();
    if(k==='tras'){S.modalRender&&S.modalRender()}else{const el=$('#lines');if(el)el.innerHTML=linesHtml(k)}
  }
  if(t.closest('#confirmForm'))paintConfirm();
  if(t.dataset.ch)A[t.dataset.ch](t);
});

/* confirmar venta */

  const c=S.cart,cf=S.cf;
  return `${sheetH('Confirmar venta')}
  <div id="confirmForm" style="display:flex;flex-direction:column;gap:14px">
   <div class="kv"><dt>Cliente</dt><dd style="font-family:var(--f-body)">${esc(cliName(c.cliId))}</dd><dt>Total</dt><dd><b>${money(cartTotal())}</b></dd></div>
   <div class="f"><span>¿De dónde sale la mercancía?</span><div class="seg" data-g="ubic">${['casa','tramo'].map(u=>`<button data-a="cfSet" data-g="ubic" data-v="${u}" class="${cf.ubic===u?'on':''}">${UBIC[u]}</button>`).join('')}</div></div>
   <div id="stockCheck"></div>
   <div class="f"><span>Entrega</span><div class="seg">${[['ahora','Se entrega ahora'],['despues','Se entrega después']].map(([v,t])=>`<button data-a="cfSet" data-g="entrega" data-v="${v}" class="${cf.entrega===v?'on':''}">${t}</button>`).join('')}</div>${cf.entrega==='despues'?'<span class="small muted">La mercancía queda reservada hasta registrar la entrega.</span>':''}</div>
   <div class="f"><span>Forma de pago</span><div class="seg">${[['contado','Contado'],['credito','Crédito'],['parcial','Pago parcial']].map(([v,t])=>`<button data-a="cfSet" data-g="cond" data-v="${v}" class="${cf.cond===v?'on':''}">${t}</button>`).join('')}</div></div>
   <div class="fg">
    ${cf.cond==='parcial'?`<label class="f"><span>Abono inicial (C$)</span><input type="number" inputmode="decimal" id="cfAbono" value="${esc(cf.abono)}" min="0" step="any"></label>`:''}
    ${cf.cond!=='credito'?`<label class="f"><span>Medio de pago</span><select id="cfMedio">${Object.entries(MEDIO).map(([k,v])=>`<option value="${k}" ${cf.medio===k?'selected':''}>${v}</option>`).join('')}</select></label>`:''}
    ${cf.cond!=='contado'?`<label class="f"><span>Vence el</span><input type="date" id="cfVence" value="${esc(cf.vence)}"></label>`:''}
   </div>
   ${cf.cond==='parcial'?`<div class="small muted" id="cfResto"></div>`:''}
   <label class="f"><span>Nota (opcional)</span><input type="text" id="cfNota" value="${esc(cf.nota)}" placeholder="Ej.: entregar en el mercado"></label>
   <div id="cfErr"></div>
   <button class="btn pri" data-a="confirmSave" id="cfBtn">Confirmar y guardar factura</button>
  </div>`;
}
function needByPid(lineas){const m={};lineas.forEach(l=>{if(!l.pid)return;m[l.pid]=(m[l.pid]||0)+num(l.base)});return m}
const sinStockOK=()=>S.aj.permitirSinExistencia!==false;
function lineaDoc(l){
  if(l.libre){const c=r3(num(l.cant));return{libre:true,pid:null,nombre:String(l.desc||'').trim(),pres:String(l.pres||'').trim(),codigo:'',unidad:'',cant:c,base:c,precio:r2(num(l.precio)),subtotal:r2(lineSub(l)),costo:l.costo===''||l.costo==null?null:num(l.costo)}}
  const p=D().prod.get(l.pid),x=pres(p,l.pi);
  return{pid:l.pid,pi:l.pi,nombre:p.nombre,pres:x.nombre,codigo:x.codigo||'',unidad:p.unidad,variable:!!x.variable,porPeso:!!(x.variable&&x.porPeso),cant:r3(num(l.cant)),base:r3(num(l.base)),precio:r2(num(l.precio)),subtotal:r2(lineSub(l)),costo:(p.costo===''||p.costo==null)?null:num(p.costo)}}
function stockProblems(lineas,ubic){
  const need=needByPid(lineas),out=[];
  for(const pid in need){const p=D().prod.get(pid);const av=dispOf(pid,ubic);if(need[pid]-av>1e-9)out.push(`${p?p.nombre:'Producto'}: necesita ${qty(need[pid])} ${UNI[p?.unidad]||''}, hay ${qty(av)} disponibles en ${UBIC[ubic]}`)}
  return out;
}
function paintConfirm(){
  const cf=S.cf;const g=id=>$(id);
  if(g('#cfAbono'))cf.abono=g('#cfAbono').value;if(g('#cfMedio'))cf.medio=g('#cfMedio').value;if(g('#cfVence'))cf.vence=g('#cfVence').value;if(g('#cfNota'))cf.nota=g('#cfNota').value;
  const pr=stockProblems(S.cart.lineas,cf.ubic);
  const sc=$('#stockCheck');if(sc)sc.innerHTML=pr.length&&!D().L.length&&sinStockOK()?`<div class="note warn small">El inventario todavía no está cargado: la venta se guarda sin control de existencia.</div>`:pr.length?`<div class="note ${sinStockOK()?'warn':'bad'}"><b>No alcanza la existencia registrada.</b><br>${pr.map(esc).join('<br>')}<br><span class="small">${sinStockOK()?'Se permite guardar igual (está activado en Ajustes); la existencia quedará en negativo hasta que la cargues.':'Cargá el inventario en <a href="#inventario" data-a="close">Inventario → Cargar existencias</a>, cambiá la ubicación o ajustá cantidades.'}</span></div>`:`<div class="note ok small">Hay existencia suficiente en ${UBIC[cf.ubic]}.</div>`;
  const z=S.cart.lineas.filter(l=>num(l.precio)<=0).length;if(sc&&z)sc.innerHTML+=`<div class="note warn small" style="margin-top:8px">${z} producto${z>1?'s':''} con precio C$0.00. Revisá antes de confirmar.</div>`;
  const rs=$('#cfResto');if(rs)rs.textContent='Queda pendiente: '+money(cartTotal()-num(cf.abono));
}
function cfRender(){$('#modal .sheet').innerHTML=confirmHtml();paintConfirm()}

async function confirmSave(btn){
  if(S.saving)return;
  const c=S.cart,cf=S.cf;paintConfirm();
  const err=m=>{$('#cfErr').innerHTML=`<div class="note bad">${esc(m)}</div>`};
  const tot=cartTotal();
  for(const l of c.lineas){if(l.libre&&!String(l.desc||'').trim())return err('Escribí la descripción del artículo libre.');const p=D().prod.get(l.pid);if(!(num(l.cant)>0)||!(num(l.base)>0))return err(`Revisá la cantidad${pres(p,l.pi).variable?' y el peso real':''} de ${p?.nombre||'un producto'}.`);if(num(l.precio)<0)return err('Hay un precio negativo.')}
  if(cf.cond!=='contado'&&!c.cliId)return err('Para crédito o pago parcial elegí un cliente con cuenta (no “Cliente de contado”).');
  if(cf.cond==='parcial'&&!(num(cf.abono)>0&&num(cf.abono)<tot))return err('El abono inicial debe ser mayor que cero y menor que el total.');
  if(cf.cond!=='contado'&&!cf.vence)return err('Indicá la fecha de vencimiento.');
  const pr=stockProblems(c.lineas,cf.ubic);if(pr.length&&!sinStockOK())return err('No hay existencia suficiente. Revisá el aviso de arriba.');
  S.saving=true;btn.disabled=true;btn.textContent='Guardando…';
  try{
    if(c.num&&c.numKind&&c.numKind!=='factura')await liberarNum(c);
    if(!c.num){c.num=await nextNum('factura');c.numKind='factura';c.fecha=new Date().toISOString();saveCart()}
    const lineas=c.lineas.map(lineaDoc);
    const doc={tipo:'factura',num:c.num,fecha:c.fecha,por:S.uid||null,cliId:c.cliId||null,ubic:cf.ubic,entrega:cf.entrega,condicion:cf.cond,
      vence:cf.cond==='contado'?null:cf.vence,lineas,total:tot,
      pagoInicial:cf.cond==='contado'?{monto:tot,medio:cf.medio}:cf.cond==='parcial'?{monto:r2(num(cf.abono)),medio:cf.medio}:{monto:0,medio:null},
      nota:cf.nota||'',titulo:c.titulo||'',desdeCot:c.desdeCot||null};
    await put('ventas/'+c.id,doc);
    if(c.desdeCot){try{await put('ventas/'+c.desdeCot,{estado:'convertida',facturaId:c.id},true)}catch(e){}}
    const id=c.id;newCart('venta');S.saving=false;closeModal();render();toast(`Factura ${pad(doc.num)} guardada`);
    openVenta(id);
  }catch(e){S.saving=false;btn.disabled=false;btn.textContent='Reintentar guardar';err(errMsg(e)+' La venta todavía no está guardada; podés reintentar sin duplicarla.')}
}
async function saveCot(btn){
  if(S.saving)return;const c=S.cart;
  for(const l of c.lineas){if(!(num(l.cant)>0)){toast('Revisá las cantidades.',1);return}}
  if(c.lineas.some(l=>l.libre&&!String(l.desc||'').trim())){toast('Escribí la descripción del artículo libre.',1);return}
  S.saving=true;btn.disabled=true;btn.textContent='Guardando…';
  try{
    if(c.num&&c.numKind&&c.numKind!=='cotizacion')await liberarNum(c);
    if(!c.num){c.num=await nextNum('cotizacion');c.numKind='cotizacion';c.fecha=new Date().toISOString();saveCart()}
    for(const l of c.lineas)if(l.libre&&!String(l.desc||'').trim())throw{message:'Escribí la descripción del artículo libre.'};
    const lineas=c.lineas.map(lineaDoc);
    await put('ventas/'+c.id,{tipo:'cotizacion',estado:'abierta',num:c.num,fecha:c.fecha,por:S.uid||null,cliId:c.cliId||null,lineas,total:cartTotal(),titulo:c.titulo||'',valida:addDays(hoy(),num(S.aj.validezCot)||8)});
    const id=c.id;newCart('cotizacion');S.saving=false;render();toast(`Cotización ${pad(D().ven.get(id)?.num||'')} guardada`);openVenta(id);
  }catch(e){S.saving=false;btn.disabled=false;btn.textContent='Reintentar';toast(errMsg(e),1)}
}

function bizHead(){const a=S.aj;return{nombre:a.nombre||'DISALES',giro:a.giro||'DISTRIBUCIÓN DE ALIMENTOS Y ESPECIAS',slogan:a.slogan||'Tú necesitas tener lo mejor',dir:a.direccion||'',tel:a.telefono||'',email:a.email||'',ruc:a.ruc||'',
  cheque:a.pagoCheque||'',banco:a.pagoBanco||'',pie:a.pie||'Gracias por su confianza, Dios le bendiga',regimen:a.regimen==null?'Cuota Fija':a.regimen,firma:a.firma||'',
  obs:(a.obsCot!=null?String(a.obsCot).split('\n'):OBS_DEF).map(x=>x.trim()).filter(Boolean)}}
const dmy=d=>{if(!d)return'';const x=new Date(d.length===10?d+'T12:00:00':d);return `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()}`};
const PLUR={Libra:'Libras',Onza:'Onzas',Saco:'Sacos',Litro:'Litros','Galón':'Galones',Garrafa:'Garrafas',Chulo:'Chulos',Unidad:'Unidades',Quintal:'Quintales',Bolsa:'Bolsas',Botella:'Botellas'};
const uLbl=l=>num(l.cant)===1?(l.pres||''):(PLUR[l.pres]||l.pres||'');
const mny=n=>(+n||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
function cliInfo(id){const c=id?D().cli.get(id):null;return{id:c?(c.codigo||''):'',nombre:c?c.nombre:'Cliente de contado',dir:c?(c.direccion||''):'',tel:c?(c.telefono||''):''}}
function enLetras(n){
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const h=x=>{if(!x)return'';if(x===100)return'cien';const r=x%100;const t=r<30?U[r]:T[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'');return(C[Math.floor(x/100)]+' '+t).trim()};
  const un=w=>w.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  n=Math.max(0,+n||0);const ent=Math.floor(n+1e-9),cent=Math.round((n-ent)*100);
  const mi=Math.floor(ent/1e6),mil=Math.floor(ent/1000)%1000,re=ent%1000;const w=[];
  if(mi)w.push(mi===1?'un millón':un(h(mi))+' millones');if(mil)w.push(mil===1?'mil':un(h(mil))+' mil');if(re)w.push(h(re));
  const t=w.length?un(w.join(' ')):'cero';
  return t.charAt(0).toUpperCase()+t.slice(1)+` córdobas con ${String(cent).padStart(2,'0')}/100`;
}
function modelVenta(v){
  const d=D(),b=bizHead(),cot=v.tipo==='cotizacion';
  const m={biz:b,kind:cot?'cot':'fac',titulo:cot?'Cotización':'Factura',numero:String(v.num??''),fecha:dmy(v.fecha),vence:cot?dmy(v.valida):dmy(v.vence),venceLbl:cot?'Válida hasta':'Vencimiento',
    cond:cot?null:(v.condicion==='contado'?'contado':'credito'),cliente:cliInfo(v.cliId),encabezado:v.titulo||'',
    cols:['Cod. Prod.','Descripción','Unidad','Cant.','Precio','Sub-Total'],
    filas:(v.lineas||[]).map(l=>[l.codigo||'',l.nombre+(l.variable?` (${qty(l.base)} ${UNI[l.unidad]||''})`:''),uLbl(l),qty(l.cant),mny(l.precio),mny(l.subtotal)]),
    total:num(v.total),extra:[],notas:[]};
  if(!cot){const pi=num(v.pagoInicial&&v.pagoInicial.monto),ab=d.abonos[v.id]||0,cr=d.credito[v.id]||0;
    if(v.condicion!=='contado'||ab||cr){if(pi)m.extra.push(['Pagado al facturar',pi]);if(ab)m.extra.push(['Abonos',ab]);if(cr)m.extra.push(['Devoluciones',cr]);m.extra.push(['Saldo',d.saldo[v.id]])}
    if(v.entrega==='despues')m.notas.push('Entrega posterior');}
  if(v.nota)m.notas.push(v.nota);
  if(v.estado==='anulada'&&!cot)m.notas.unshift('*** DOCUMENTO ANULADO *** '+(v.anulaMotivo||''));
  return m;
}
function saldoAntesDe(v,p){
  let x=num(v.total)-num(v.pagoInicial&&v.pagoInicial.monto);
  S.d.pagos.forEach(q=>{if((q.tipo==='cobro'||q.tipo==='aplicaFavor')&&q.estado!=='anulado'&&q.id!==p.id&&q.fecha<p.fecha)(q.aplicaciones||[]).forEach(a=>{if(a.ventaId===v.id)x-=num(a.monto)})});
  S.d.devoluciones.forEach(dv=>{if(dv.ventaId===v.id&&dv.fecha<p.fecha)x-=num(dv.credito)});
  return r2(x);
}
function modelRecibo(p){
  const d=D(),b=bizHead();
  const filas=(p.aplicaciones||[]).map(a=>{const v=d.ven.get(a.ventaId);const ant=v?saldoAntesDe(v,p):num(a.monto);
    return[v&&!v.apertura?String(v.num??''):'',v?(v.apertura?'Saldo anterior':'Factura N° '+v.num):'Factura',dmy(v&&v.fecha),mny(ant),mny(a.monto),mny(ant-num(a.monto))]});
  return{biz:b,kind:'rec',titulo:'Recibo',numero:String(p.num??''),fecha:dmy(p.fecha),cliente:cliInfo(p.cliId),
    cols:['Factura','Descripción','Fecha','Saldo anterior','Abono','Saldo nuevo'],filas,total:num(p.monto),letras:enLetras(p.monto),medio:MEDIO[p.medio]||'',
    extra:[['Saldo pendiente del cliente',saldoCliente(p.cliId)]],notas:[p.estado==='anulado'?'*** RECIBO ANULADO *** '+(p.anulaMotivo||''):'',p.nota||''].filter(Boolean)};
}

function waText(m){
  const b=m.biz;
  let t=`*${b.nombre}* · ${b.giro}\n*${m.titulo.toUpperCase()} N° ${m.numero}*\nFecha: ${m.fecha}${m.vence?`\n${m.venceLbl}: ${m.vence}`:''}\nCliente: ${m.cliente.nombre}${m.cliente.id?' ('+m.cliente.id+')':''}`;
  if(m.kind==='fac')t+=`\nCondición de pago: ${m.cond==='contado'?'Contado':'Crédito'}`;
  if(m.encabezado)t+=`\n\n*${m.encabezado}*`;
  if(m.kind==='rec')t+=`\n\nRecibimos *C$ ${mny(m.total)}* (${m.letras}) · ${m.medio}\n\n`+m.filas.map(f=>`• ${f[1]}: saldo C$ ${f[3]} − abono C$ ${f[4]} = *C$ ${f[5]}*`).join('\n');
  else t+='\n\n'+m.filas.map(f=>`• ${f[0]?f[0]+' · ':''}${f[1]}\n   ${f[3]} ${f[2]} × C$ ${f[4]} = *C$ ${f[5]}*`).join('\n');
  t+=`\n\n*${m.kind==='rec'?'Total recibido':m.kind==='cot'?'Subtotal':'Total'}: C$ ${mny(m.total)}*`+m.extra.map(e=>`\n${e[0]}: C$ ${mny(e[1])}`).join('')+(b.regimen?`\n_${b.regimen}_`:'');
  if(m.notas.length)t+='\n'+m.notas.join(' · ');
  if(m.kind==='cot'&&b.obs.length)t+='\n\n*Observaciones:*\n'+b.obs.map(o=>'* '+o).join('\n');
  if(b.cheque||b.banco)t+='\n\n'+[b.cheque,b.banco].filter(Boolean).join('\n');
  return t+'\n\n'+b.pie;
}

async function downloadPDF(m){
  try{const dl=await claude.use('downloads');if(!dl){toast('Las descargas no están disponibles en esta vista.',1);return false}
    const buf=await makePDF(m);await dl.save({filename:pdfName(m),data:buf});toast('PDF listo');return true}
  catch(e){if(e&&e.code==='declined')return false;toast((e&&e.message)||'No se pudo crear el PDF',1);return false}
}
/* Compartir con el menú del teléfono (como una app instalada). El PDF se prepara apenas se abre el
   documento, porque el teléfono solo deja compartir si se llama justo al tocar el botón. */
const pdfCache={};
async function prepPdf(m){const k=m.kind+m.numero+'|'+m.total+'|'+(m.notas||[]).join();if(pdfCache.k===k)return;
  try{const buf=await makePDF(m);pdfCache.k=k;pdfCache.file=new File([buf],pdfName(m),{type:'application/pdf'})}catch(e){}}
async function pdfShare(btn){
  const m=S.curModel,f=pdfCache.file;
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:pdfName(m)});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  toast('Este navegador no deja abrir el menú Compartir aquí; usá Guardar PDF y abrir WhatsApp.',1);
  pdfWa(btn.parentNode.querySelector('[data-a=pdfWa]')||btn);
}
/* paso 1: guarda el PDF; paso 2: botón que abre el chat del cliente con el mensaje corto */
async function pdfWa(btn){
  btn.disabled=true;btn.textContent='Preparando PDF…';const m=S.curModel;
  const ok=await downloadPDF(m);btn.disabled=false;btn.textContent='Guardar PDF y abrir WhatsApp';
  if(!ok)return;S.shareOk=m.kind+m.numero;const st=$('#shareStep');if(st)st.innerHTML=shareStepHtml(m);
}

    <details><summary>Historial</summary><div class="list" style="margin-top:6px">${hist.map(h=>`<div class="li"><div class="grow"><div class="t" style="font-weight:500">${esc(h[1])}</div><div class="s">${fdt(h[0])} · ${esc(who(h[2]))}</div></div></div>`).join('')}</div></details>`;
  };
  openModal('');S.modalRender();
}
function gananciaVenta(v){
  const d=D();let costo=0,completo=true;
  (v.lineas||[]).forEach((l,i)=>{const dev=(d.devuelto[v.id]||[])[i]||0,can=(d.cancelado[v.id]||[])[i]||0;const b=num(l.base)-can;if(l.costo==null)completo=false;else costo+=num(l.costo)*b});
  const reparto=S.d.pagos.filter(p=>p.tipo==='gasto'&&p.ventaId===v.id).reduce((s,p)=>s+num(p.monto),0);
  const ventaNeta=num(v.total)-(d.credito[v.id]||0);
  // devolución que regresa al inventario recupera su costo
  S.d.devoluciones.filter(x=>x.ventaId===v.id).forEach(x=>(x.lineas||[]).forEach(l=>{if(!l.pendiente&&l.regresa){const vl=v.lineas[l.i];if(vl&&vl.costo!=null)costo-=num(vl.costo)*num(l.base)}}));
  return{costo:r2(costo),reparto:r2(reparto),completo,neta:r2(ventaNeta-costo-reparto)};
}

function calcCredito(v){let c=0;for(const i in S.dv.q){const l=v.lineas[i];if(l&&num(l.base)>0)c+=num(S.dv.q[i])/num(l.base)*num(l.subtotal)}for(const i in S.dv.pend){const l=v.lineas[i];if(l&&num(l.base)>0)c+=num(S.dv.pend[i])/num(l.base)*num(l.subtotal)}return r2(c)}
async function devSave(btn,id){

  try{await put('devoluciones/'+x.id,{ventaId:id,ubic:v.ubic,lineas,credito,reembolso:re,motivo:x.motivo,...stamp()});S.saving=false;toast('Devolución guardada');openVenta(id)}

function favores(cliId){return S.d.ventas.filter(v=>v.tipo==='factura'&&v.cliId===cliId&&(D().saldo[v.id]||0)<-0.004)}
/* usa el saldo a favor del cliente para pagar sus facturas pendientes (sin mover caja) */
async function favorAplicar(btn){
  if(S.saving)return;const cliId=S.cobro.cliId;const d=D();
  const fav=favores(cliId).map(v=>({id:v.id,m:-d.saldo[v.id]}));const pend=facturasPend(cliId);
  let disp=r2(fav.reduce((s,x)=>s+x.m,0));const apl=[];
  for(const v of pend){if(disp<=0.004)break;const a=r2(Math.min(d.saldo[v.id],disp));if(a>0.004){apl.push({ventaId:v.id,monto:a});disp=r2(disp-a)}}
  let usar=r2(apl.reduce((s,a)=>s+a.monto,0));if(!(usar>0))return;
  const total=usar;
  for(const f of fav){if(usar<=0.004)break;const u=r2(Math.min(f.m,usar));apl.push({ventaId:f.id,monto:-u});usar=r2(usar-u)}
  S.saving=true;btn.disabled=true;
  try{await put('pagos/'+nid(),{tipo:'aplicaFavor',cliId,monto:total,medio:'favor',aplicaciones:apl,nota:'Aplicación de saldo a favor',...stamp()});S.saving=false;toast(`Saldo a favor aplicado: ${money(total)}`);render()}
  catch(e){S.saving=false;btn.disabled=false;toast(errMsg(e),1)}
}
function facturasPend(cliId){return S.d.ventas.filter(v=>v.tipo==='factura'&&v.cliId===cliId&&(D().saldo[v.id]||0)>0.004).sort((a,b)=>(a.vence||a.fecha)<(b.vence||b.fecha)?-1:1)}
function paintCobroCli(){const el=$('#cobroCliRes'),q=$('#cobroCliQ');if(!el||!q)return;const s=norm(q.value).trim();if(!s){el.innerHTML='';return}
  const r=S.d.clientes.filter(c=>norm(c.nombre).includes(s)||String(c.telefono||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')||'#')).slice(0,12);
  el.innerHTML=r.map(c=>`<button data-a="cobrarCli" data-id="${c.id}"><div style="flex:1"><div class="t">${esc(c.nombre)}</div><div class="small muted">${esc(c.telefono||'')}</div></div><span class="num">${money(saldoCliente(c.id))}</span></button>`).join('')||'<div class="empty small">Sin resultados</div>'}
function cobroAuto(){const c=S.cobro;let rest=num(c.monto);c.apl={};facturasPend(c.cliId).forEach(v=>{const s=D().saldo[v.id];const a=Math.min(s,rest);if(a>0.004){c.apl[v.id]=r2(a);rest-=a}})}
function cobroInput(t){const c=S.cobro;
  if(t.dataset.cob==='monto'){c.monto=t.value;cobroAuto();document.querySelectorAll('[data-cob=apl]').forEach(i=>i.value=c.apl[i.dataset.id]??'')}
  else c.apl[t.dataset.id]=t.value;
  const fs=facturasPend(c.cliId),tot=fs.reduce((s,v)=>s+D().saldo[v.id],0),apl=Object.values(c.apl).reduce((s,x)=>s+num(x),0);
  $('#cobApl').textContent=money(apl);$('#cobQueda').textContent=money(tot-apl);
  const m=$('#cobMsg');const diff=r2(num(c.monto)-apl);
  m.innerHTML=Math.abs(diff)>0.004&&num(c.monto)>0?`<div class="note warn small">${diff>0?`Sobran ${money(diff)} sin aplicar. Ajustá la distribución o el monto.`:`Aplicaste ${money(-diff)} más de lo recibido.`}</div>`:'';
}
async function cobroSave(btn){
  if(S.saving)return;const c=S.cobro;c.nota=$('#cobNota').value;
  const monto=r2(num(c.monto));const apls=Object.entries(c.apl).map(([ventaId,m])=>({ventaId,monto:r2(num(m))})).filter(a=>a.monto>0);
  const sum=r2(apls.reduce((s,a)=>s+a.monto,0));
  if(!(monto>0))return toast('Indicá el monto recibido.',1);

  try{if(!c.id)c.id=nid();if(!c.num)c.num=await nextNum('recibo');
    await put('pagos/'+c.id,{tipo:'cobro',num:c.num,cliId:c.cliId,monto,medio:c.medio,aplicaciones:apls,nota:c.nota||'',...stamp()});

/* ========= ANULACIONES =========
   Un documento nunca se borra: se marca anulado con motivo, quién y cuándo.
   Regla: cada usuario puede anular lo suyo del mismo día; el propietario puede anular cualquier documento. */
const puedeAnular=doc=>S.admin||(doc.por&&doc.por===S.uid&&dia(doc.fecha)===hoy());
function anularOpen(kind,id){
  const rec=kind==='recibo';const doc=rec?S.d.pagos.find(p=>p.id===id):D().ven.get(id);if(!doc)return;
  if(!puedeAnular(doc))return toast('Solo el propietario puede anular documentos de otra persona o de días anteriores.',1);
  let body='';
  if(rec){
    body=`<div class="small">Recibo ${pad(doc.num)} · ${esc(cliName(doc.cliId))} · ${money(doc.monto)}</div>
    <div class="note small">Las facturas a las que se aplicó vuelven a quedar con su saldo, y el monto se registra como salida de caja hoy.</div>`;
  }else{
    const abs=S.d.pagos.filter(p=>p.tipo==='cobro'&&p.estado!=='anulado'&&(p.aplicaciones||[]).some(a=>a.ventaId===id));
    if(abs.length)return toast(`Esta factura tiene abonos (recibo ${abs.map(p=>pad(p.num)).join(', ')}). Anulá primero esos recibos.`,1);
    if(S.d.pagos.some(p=>p.tipo==='aplicaFavor'&&(p.aplicaciones||[]).some(a=>a.ventaId===id)))return toast('Esta factura tiene saldo a favor aplicado; no se puede anular.',1);
    if(S.d.devoluciones.some(x=>x.ventaId===id))return toast('Esta factura tiene devoluciones registradas; no se puede anular.',1);
    const pi=num(doc.pagoInicial&&doc.pagoInicial.monto);
    body=`<div class="small">${doc.apertura?'Saldo de apertura':'Factura '+pad(doc.num)} · ${esc(cliName(doc.cliId))} · ${money(doc.total)}</div>
    <div class="note small">La factura deja de contar como venta${doc.apertura?'':' y la mercancía que salió regresa a '+UBIC[doc.ubic]}. El número queda registrado como anulado (no se reutiliza).</div>
    ${pi>0?`<label class="f"><span>El cliente pagó ${money(pi)} al facturar. ¿Qué pasa con ese dinero?</span><select id="anDin"><option value="devuelto">Se le devolvió (sale de caja hoy)</option>${doc.cliId?'<option value="favor">Queda como saldo a favor del cliente</option>':''}</select></label>`:''}`;
  }
  openModal(`${sheetH(rec?'Anular recibo':'Anular factura')}${body}
  <label class="f"><span>Motivo (obligatorio)</span><input type="text" id="anMot" placeholder="Ej.: se facturó al cliente equivocado"></label>
  <div id="anErr"></div><button class="btn pri danger" data-a="anularSave" data-k="${kind}" data-id="${id}">Confirmar anulación</button>`);
}
async function anularSave(btn,kind,id){
  if(S.saving)return;const mot=$('#anMot').value.trim();
  if(!mot){$('#anErr').innerHTML='<div class="note bad">Escribí el motivo de la anulación.</div>';return}
  const rec=kind==='recibo';const data={estado:rec?'anulado':'anulada',anulaPor:S.uid||null,anulaFecha:new Date().toISOString(),anulaMotivo:mot};
  if(!rec&&$('#anDin'))data.anulaFavor=$('#anDin').value==='favor';
  S.saving=true;btn.disabled=true;btn.textContent='Guardando…';
  try{await put((rec?'pagos/':'ventas/')+id,data,true);S.saving=false;toast(rec?'Recibo anulado':'Factura anulada');rec?openRecibo(id):openVenta(id)}
  catch(e){S.saving=false;btn.disabled=false;btn.textContent='Reintentar';$('#anErr').innerHTML=`<div class="note bad">${esc(errMsg(e))}</div>`}
}
