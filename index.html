/* ========= INVENTARIO ========= */
function vInventario(){
  if(S.conteo)return vConteo();
  const q=norm(S.invQ||'');
  const P=[...S.d.productos].filter(p=>!q||norm(p.nombre).includes(q)||norm(p.categoria).includes(q)).filter(p=>!S.invNeg||stockOf(p.id,'casa')<-1e-9||stockOf(p.id,'tramo')<-1e-9).sort((a,b)=>norm(a.nombre)<norm(b.nombre)?-1:1);
  const sinInv=S.d.productos.length&&!D().L.length;
  const val=P.reduce((s,p)=>s+(p.costo==null||p.costo===''?0:num(p.costo)*(stockOf(p.id,'casa')+stockOf(p.id,'tramo'))),0);
  const sinCosto=P.filter(p=>(p.costo==null||p.costo==='')&&(stockOf(p.id,'casa')+stockOf(p.id,'tramo'))>0).length;
  const neg=S.d.productos.filter(p=>stockOf(p.id,'casa')<-1e-9||stockOf(p.id,'tramo')<-1e-9);
  return `<div class="page"><div class="page-h"><h1>Inventario</h1><div class="row"><button class="btn pri" data-a="conteoOpen">Cargar existencias</button><button class="btn" data-a="trasOpen">${ico('swap')} Trasladar</button><button class="btn" data-a="ajOpen">Pérdida</button></div></div>
  ${sinInv?`<div class="note warn"><b>Todavía no hay existencias cargadas.</b> Tocá <b>Cargar existencias</b> y escribí cuánto hay de cada producto en la bodega de la casa y en el tramo. Después, las compras suman y las ventas restan solas.</div>`:''}
  <input type="search" id="invQ" data-ch="invQ" value="${esc(S.invQ||'')}" placeholder="Buscar producto o categoría">
  ${S.invNeg?`<div class="note warn small">Mostrando solo productos con existencia negativa. <button class="btn ghost sm" data-a="invNeg">Ver todos</button></div>`:''}
  <div class="stats"><div class="stat"><span class="lbl">Inventario valorizado</span><span class="v">${money(val)}</span>${sinCosto?`<span class="warn">${sinCosto} producto${sinCosto>1?'s':''} sin costo</span>`:''}</div>
  <div class="stat"><span class="lbl">Productos</span><span class="v">${P.length}</span></div>
  ${neg.length?`<button class="stat" data-a="invNeg"><span class="lbl">En negativo</span><span class="v" style="color:var(--bad)">${neg.length}</span><span class="small muted">vendidos sin existencia · corregir con conteo</span></button>`:''}</div>
  <div class="card">${P.length?`<div class="tw"><table><thead><tr><th>Producto</th><th class="n">Casa</th><th class="n">Tramo</th><th class="n">Reservado</th><th class="n">Disponible</th><th class="n">Total</th></tr></thead><tbody>
   ${P.map(p=>{const c=stockOf(p.id,'casa'),t=stockOf(p.id,'tramo'),r=resOf(p.id,'casa')+resOf(p.id,'tramo');const disp=c+t-r;const low=num(p.minimo)>0&&disp<num(p.minimo);const u=UNI[p.unidad]||'';
    const ng=x=>x<-1e-9?`<span style="color:var(--bad);font-weight:600">${qty(x)}</span>`:qty(x);
    return `<tr class="click ${low?'low':''}" data-a="prodMov" data-id="${p.id}"><td><b>${esc(p.nombre)}</b><div class="small muted">${u}${low?' · <span style="color:var(--amber)">bajo el mínimo ('+qty(p.minimo)+')</span>':''}</div></td><td class="n">${ng(c)}</td><td class="n">${ng(t)}</td><td class="n">${r?qty(r):'—'}</td><td class="n"><b>${qty(disp)}</b></td><td class="n">${qty(c+t)}</td></tr>`}).join('')}</tbody></table></div>`
   :`<div class="empty">No hay productos. Agregalos en <a href="#catalogo">Catálogo</a> y cargá sus existencias en <a href="#ajustes">Ajustes</a>.</div>`}
   <div class="small muted">Tocá un producto para ver sus movimientos. Las cantidades están en la unidad de control (libras, litros…).</div></div></div>`;
}

/* conteo / carga de existencias en un solo documento */
function vConteo(){
  const c=S.conteo,q=norm(c.q||'');
  const P=[...S.d.productos].filter(p=>!q||norm(p.nombre).includes(q)||norm(p.categoria).includes(q)).sort((a,b)=>norm(a.nombre)<norm(b.nombre)?-1:1);
  const n=conteoCambios().length;
  return `<div class="page"><div class="page-h"><div><h1>Cargar existencias</h1><div class="small muted">Escribí lo que hay físicamente. Solo se guarda la diferencia con lo registrado.</div></div><button class="btn ghost" data-a="conteoCancel">Cancelar</button></div>
  <div class="note small">Cantidades en la unidad de control de cada producto: libras para especias, litros para ácido. Ejemplo: 1 garrafa de ácido = 30 litros. El costo es opcional y sirve para calcular la ganancia.</div>
  <input type="search" id="cntQ" value="${esc(c.q||'')}" placeholder="Buscar producto">
  <div class="card" style="padding:8px 12px"><div class="tw"><table><thead><tr><th>Producto</th><th class="n">Bodega casa</th><th class="n">Tramo</th><th class="n">Costo por unidad</th></tr></thead><tbody>
  ${P.map(p=>{const u=UNI[p.unidad]||'';const v=c.v[p.id]||{};const ci=(k,cur)=>`<input type="number" inputmode="decimal" step="any" style="width:96px;min-height:40px;text-align:right" data-cnt="${p.id}" data-u="${k}" value="${esc(v[k]??'')}" placeholder="${qty(cur)}">`;
    return `<tr><td><b>${esc(p.nombre)}</b><div class="small muted">${u}</div></td><td class="n">${ci('casa',stockOf(p.id,'casa'))}</td><td class="n">${ci('tramo',stockOf(p.id,'tramo'))}</td><td class="n">${ci('costo',p.costo==null||p.costo===''?0:p.costo)}</td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="sumbar"><div><div class="lbl" style="color:inherit;opacity:.7">Cambios</div><div class="tot" id="cntN">${n}</div></div><div class="spacer"></div>
   <label class="row small" style="color:inherit"><input type="checkbox" id="cntApertura" ${c.apertura?'checked':''} data-ch="cntAp"> Es el inventario inicial</label>
   <button class="btn pri" data-a="conteoSave">Guardar existencias</button></div></div>`;
}
function conteoCambios(){const c=S.conteo,out=[];
  for(const pid in c.v){const v=c.v[pid];for(const u of ['casa','tramo']){if(v[u]!==undefined&&v[u]!==''){const d=r3(num(v[u])-stockOf(pid,u));if(Math.abs(d)>1e-9)out.push({pid,ubic:u,q:d})}}}
  return out}
async function conteoSave(btn){
  if(S.saving)return;const c=S.conteo;const L=conteoCambios();
  const costos=Object.entries(c.v).filter(([pid,v])=>v.costo!==undefined&&v.costo!==''&&num(v.costo)!==num(D().prod.get(pid)?.costo));
  if(!L.length&&!costos.length)return toast('No hay cambios para guardar.',1);
  S.saving=true;btn.disabled=true;btn.textContent='Guardando…';
  try{
    if(L.length&&!c.saved){await put('movs/'+c.id,{tipo:c.apertura?'Apertura':'Ajuste por conteo',nota:c.apertura?'Inventario inicial':'Conteo físico',lineas:L,...stamp()});c.saved=true}
    for(const [pid,v] of costos){await put('productos/'+pid,{costo:num(v.costo)},true)}
    S.conteo=null;S.saving=false;render();toast(`Existencias guardadas (${L.length} cambio${L.length===1?'':'s'})`);
  }catch(e){S.saving=false;btn.disabled=false;btn.textContent='Reintentar';toast(errMsg(e)+' Podés reintentar sin duplicar.',1)}
}
function prodMov(id){const p=D().prod.get(id);const L=D().L.filter(m=>m.pid===id).slice(0,150);const u=UNI[p.unidad]||'';
  openModal(`${sheetH(esc(p.nombre))}<div class="kv"><dt>Bodega casa</dt><dd>${qty(stockOf(id,'casa'))} ${u}</dd><dt>Tramo</dt><dd>${qty(stockOf(id,'tramo'))} ${u}</dd><dt>Reservado</dt><dd>${qty(resOf(id,'casa')+resOf(id,'tramo'))} ${u}</dd><dt>Costo por ${u}</dt><dd>${p.costo==null||p.costo===''?'sin costo (lo que pagás al proveedor)':money(p.costo)}</dd></div>
  <div class="lbl" style="margin-top:4px">Precios de venta</div><div class="kv">${(p.presentaciones||[]).map(x=>`<dt>${esc(x.nombre)}${x.codigo?' · '+esc(x.codigo):''}</dt><dd>${x.variable&&!x.porPeso?'se fija al vender':num(x.precio)>0?money(x.precio)+(x.porPeso?' por '+u:''):'<span style="color:var(--bad)">sin precio</span>'}</dd>`).join('')}</div>
  <div class="list">${L.map(m=>`<${m.ventaId?`button class="li" data-a="openVenta" data-id="${m.ventaId}"`:'div class="li"'}><div class="grow"><div class="t" style="font-weight:500">${esc(m.tipo)} · ${UBIC[m.ubic]||''}</div><div class="s">${fdt(m.fecha)}${m.nota?' · '+esc(m.nota):''} · ${esc(who(m.por))}</div></div><span class="amt" style="color:${m.q<0?'var(--bad)':'var(--good)'}">${m.q>0?'+':''}${qty(m.q)}</span></${m.ventaId?'button':'div'}>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div>`)}
function prodOptions(sel){return S.d.productos.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.nombre)} (${UNI[p.unidad]||''})</option>`).join('')}
function trasOpen(){

function vCompras(){

async function compraSave(btn){
  if(S.saving)return;const c=S.compra;
  if(!c.provId&&c.pago!=='tarjeta')return toast('Elegí el proveedor.',1);
  for(const l of c.lineas){if(!(num(l.base)>0))return toast('Revisá cantidades y pesos.',1);if(l.costo===''||num(l.costo)<0)return toast('Indicá el costo de cada línea.',1)}
  if(c.pago==='credito'&&!c.vence)return toast('Indicá cuándo vence el crédito.',1);
  S.saving=true;btn.disabled=true;btn.textContent='Guardando…';
  try{
    const lineas=c.lineas.map(l=>{const p=D().prod.get(l.pid);return{pid:l.pid,nombre:p.nombre,pres:pres(p,l.pi).nombre,unidad:p.unidad,cant:r3(num(l.cant)),base:r3(num(l.base)),costo:r2(num(l.costo))}});
    await put('compras/'+c.id,{provId:c.provId||null,ubic:c.ubic,lineas,total:compraTotal(),pago:c.pago,medio:c.pago==='contado'?c.medio:null,vence:c.pago==='credito'?c.vence:null,transporte:r2(num(c.transporte)),medioT:c.medioT,nota:c.nota||'',...stamp()});
    S.compra=null;S.saving=false;render();toast('Compra guardada; la existencia ya aumentó');
    for(const l of lineas){if(l.base>0){try{await put('productos/'+l.pid,{costo:r3(l.costo/l.base)},true)}catch(e){}}}
  }catch(e){S.saving=false;btn.disabled=false;btn.textContent='Reintentar';toast(errMsg(e),1)}
}

      ${Math.abs(num(cie.esperado)-esperado)>0.004?`<div class="note warn small">Hubo movimientos después del cierre. El esperado ahora es ${money(esperado)} (al cerrar era ${money(cie.esperado)}).</div>`:''}<button class="btn ghost sm" data-a="cierreRedo">Volver a cerrar</button>`

/* ========= REPORTES ========= */
function rango(){
  const t=hoy(),r=S.rp;const dt=new Date(t+'T12:00:00');
  if(r.p==='hoy')return[t,t];
  if(r.p==='semana'){const w=(dt.getDay()+6)%7;return[addDays(t,-w),t]}
  if(r.p==='mes')return[t.slice(0,8)+'01',t];
  if(r.p==='año')return[t.slice(0,5)+'01-01',t];
  return[r.a||t,r.b||t];
}
function vReportes(){
  const [a,b]=rango();const inR=f=>{const x=dia(f);return x>=a&&x<=b};const d=D();
  const V=S.d.ventas.filter(v=>vigente(v)&&!v.apertura&&inR(v.fecha));
  const nAnul=S.d.ventas.filter(v=>v.tipo==='factura'&&v.estado==='anulada'&&!v.sinUso&&inR(v.anulaFecha||v.fecha)).length;
  const devR=S.d.devoluciones.filter(x=>inR(x.fecha));
  const ventas=V.reduce((s,v)=>s+num(v.total),0)-devR.reduce((s,x)=>s+num(x.credito),0);
  let costo=0,incompleto=false;const porProd={},porCli={};
  V.forEach(v=>{(v.lineas||[]).forEach(l=>{const key=l.pid||('libre:'+norm(l.nombre));const pp=porProd[key]||(porProd[key]={nombre:l.nombre,unidad:l.unidad,cant:0,venta:0,costo:0,inc:false,ids:new Set()});pp.cant+=num(l.base);pp.venta+=num(l.subtotal);pp.ids.add(v.id);
    if(l.costo==null){incompleto=true;pp.inc=true}else{costo+=num(l.costo)*num(l.base);pp.costo+=num(l.costo)*num(l.base)}});
    const k=v.cliId||'_';const pc=porCli[k]||(porCli[k]={nombre:cliName(v.cliId),venta:0,costo:0,inc:false,ids:new Set()});pc.venta+=num(v.total);pc.ids.add(v.id);(v.lineas||[]).forEach(l=>{if(l.costo==null)pc.inc=true;else pc.costo+=num(l.costo)*num(l.base)})});
  devR.forEach(x=>{const v=d.ven.get(x.ventaId);if(!v)return;(x.lineas||[]).forEach(l=>{const vl=v.lineas[l.i];if(!vl)return;const pp=porProd[vl.pid||('libre:'+norm(vl.nombre))];const fr=num(vl.base)?num(l.base)/num(vl.base)*num(vl.subtotal):0;if(pp){pp.venta-=fr;pp.cant-=num(l.base)}
    if(vl.costo!=null&&(l.regresa||l.pendiente)){costo-=num(vl.costo)*num(l.base);if(pp)pp.costo-=num(vl.costo)*num(l.base)}})});
  const F=flujos().filter(f=>inR(f.fecha));
  const gastos=-F.filter(f=>f.tipo==='gasto').reduce((s,f)=>s+f.monto,0);
  const perd=S.d.movs.filter(m=>m.tipo==='Pérdida'&&inR(m.fecha)).reduce((s,m)=>{const p=d.prod.get(m.pid);return s+(p&&p.costo!=null&&p.costo!==''?-num(m.q)*num(p.costo):0)},0);
  const cobrado=F.filter(f=>f.tipo==='venta'||f.tipo==='cobro'||f.tipo==='anulacion').reduce((s,f)=>s+f.monto,0);
  const bruta=ventas-costo,neta=bruta-gastos-perd;
  const compras=S.d.compras.filter(c=>!c.apertura&&inR(c.fecha)).reduce((s,c)=>s+num(c.total),0);
  const prods=Object.entries(porProd).sort((x,y)=>y[1].venta-x[1].venta);
  const clis=Object.entries(porCli).sort((x,y)=>y[1].venta-x[1].venta);
  const movidos=new Set(Object.keys(porProd));const sinMov=S.d.productos.filter(p=>!movidos.has(p.id));

  const val=S.d.productos.reduce((s,p)=>s+(p.costo==null||p.costo===''?0:num(p.costo)*(stockOf(p.id,'casa')+stockOf(p.id,'tramo'))),0);
  S.repIds={ventas:V.map(v=>v.id)};
  const inc=incompleto?'<span class="warn">Incompleta: falta costo de algún producto</span>':'';
  return `<div class="page"><div class="page-h"><h1>Reportes</h1><span class="small muted">${fdate(a)} – ${fdate(b)}</span><span class="spacer"></span><button class="btn" data-a="exportarExcel">Exportar todo a Excel</button></div>
  <div class="chips">${['hoy','semana','mes','año','rango'].map(p=>`<button class="chip ${S.rp.p===p?'on':''}" data-a="rp" data-v="${p}">${p==='rango'?'Personalizado':p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div>
  ${S.rp.p==='rango'?`<div class="fg"><label class="f"><span>Desde</span><input type="date" data-ch="rpA" value="${esc(S.rp.a||a)}"></label><label class="f"><span>Hasta</span><input type="date" data-ch="rpB" value="${esc(S.rp.b||b)}"></label></div>`:''}
  <div class="stats">
   <button class="stat" data-a="drillVentas"><span class="lbl">Ventas netas</span><span class="v">${money(ventas)}</span><span class="small muted">${V.length} facturas · ver detalle${nAnul?` · ${nAnul} anulada${nAnul>1?'s':''} (no suman)`:''}</span></button>
   <div class="stat"><span class="lbl">Costo de mercancía</span><span class="v">${money(costo)}</span>${inc}</div>
   <div class="stat"><span class="lbl">Ganancia bruta</span><span class="v">${incompleto?'—':money(bruta)}</span>${inc}</div>

   <div class="stat"><span class="lbl">Resultado</span><span class="v">${incompleto?'—':money(neta)}</span>${inc}</div>
   <div class="stat"><span class="lbl">Dinero cobrado</span><span class="v">${money(cobrado)}</span><span class="small muted">ventas + abonos</span></div>
   <div class="stat"><span class="lbl">Compras</span><span class="v">${money(compras)}</span></div>
  </div>
  <div class="card"><div class="card-h"><h2>Por producto</h2><span class="small muted">mayor a menor venta</span></div>
   ${prods.length?`<div class="tw"><table><thead><tr><th>Producto</th><th class="n">Cantidad</th><th class="n">Venta</th><th class="n">Ganancia</th></tr></thead><tbody>${prods.map(([id,p])=>`<tr class="click" data-a="drillIds" data-t="${esc(p.nombre)}" data-ids="${[...p.ids].join(',')}"><td>${esc(p.nombre)}</td><td class="n">${qty(p.cant)} ${UNI[p.unidad]||''}</td><td class="n">${money(p.venta)}</td><td class="n">${p.inc?'<span style="color:var(--amber)">incompleta</span>':money(p.venta-p.costo)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin ventas en el período.</div>'}
   ${sinMov.length?`<div class="small muted">Sin movimiento en el período: ${sinMov.map(p=>esc(p.nombre)).join(', ')}</div>`:''}</div>
  <div class="card"><h2>Por cliente</h2>${clis.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th class="n">Facturas</th><th class="n">Venta</th><th class="n">Ganancia</th></tr></thead><tbody>${clis.map(([id,c])=>`<tr class="click" data-a="drillIds" data-t="${esc(c.nombre)}" data-ids="${[...c.ids].join(',')}"><td>${esc(c.nombre)}</td><td class="n">${c.ids.size}</td><td class="n">${money(c.venta)}</td><td class="n">${c.inc?'<span style="color:var(--amber)">incompleta</span>':money(c.venta-c.costo)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin ventas en el período.</div>'}</div>
  ${(()=>{const U={};V.forEach(v=>{const k=v.por||'_';const u=U[k]||(U[k]={n:0,v:0,c:0});u.n++;u.v+=num(v.total)});
    F.filter(f=>f.tipo==='cobro'||f.tipo==='venta'||f.tipo==='anulacion').forEach(f=>{const k=f.por||'_';const u=U[k]||(U[k]={n:0,v:0,c:0});u.c+=f.monto});
    const ks=Object.keys(U);return ks.length?`<div class="card"><h2>Por usuario</h2><div class="tw"><table><thead><tr><th>Usuario</th><th class="n">Facturas</th><th class="n">Vendido</th><th class="n">Cobrado</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${esc(k==='_'?'Carga inicial':who(k))}</td><td class="n">${U[k].n}</td><td class="n">${money(U[k].v)}</td><td class="n">${money(U[k].c)}</td></tr>`).join('')}</tbody></table></div></div>`:''})()}

/* ========= ACTIVIDAD: quién hizo qué ========= */
function eventos(){
  const E=[],d=D();const add=(fecha,por,tipo,txt,monto,abrir)=>{if(fecha)E.push({fecha,por:por||null,tipo,txt,monto,abrir})};
  S.d.ventas.forEach(v=>{
    if(v.apertura)add(v.fecha,v.por,'Apertura','Saldo de apertura · '+cliName(v.cliId),v.total,['openVenta',v.id]);
    else if(v.sinUso){add(v.fecha,v.por,'Anulación',`${v.tipo==='factura'?'Factura':'Cotización'} ${pad(v.num)} no utilizada (número anulado)`,null,['openVenta',v.id]);return}
    else if(v.tipo==='factura')add(v.fecha,v.por,'Venta',`Factura ${pad(v.num)} · ${cliName(v.cliId)} · ${v.condicion==='contado'?'contado':v.condicion==='credito'?'crédito':'pago parcial'}`,v.total,['openVenta',v.id]);
    else add(v.fecha,v.por,'Cotización',`Cotización ${pad(v.num)} · ${cliName(v.cliId)}`,v.total,['openVenta',v.id]);
    if(v.anulaFecha)add(v.anulaFecha,v.anulaPor,'Anulación',`Anuló la ${v.tipo==='factura'?'factura':'cotización'} ${pad(v.num)}${v.anulaMotivo?' · '+v.anulaMotivo:''}`,v.tipo==='factura'?v.total:null,['openVenta',v.id]);
    (v.historialVence||[]).forEach(h=>add(h.fecha,h.por,'Cobro',`Cambió vencimiento de factura ${pad(v.num)}: ${h.motivo}`,null,['openVenta',v.id]));
  });
  S.d.entregas.forEach(e=>{const v=d.ven.get(e.ventaId);add(e.fecha,e.por,'Entrega',`Entrega de factura ${v?pad(v.num):''} · ${v?cliName(v.cliId):''}`,null,['openVenta',e.ventaId])});
  S.d.devoluciones.forEach(x=>{const v=d.ven.get(x.ventaId);add(x.fecha,x.por,'Devolución',`${(x.lineas||[]).some(l=>l.pendiente)?'Canceló pendiente':'Devolución'} · factura ${v?pad(v.num):''}${x.motivo?' · '+x.motivo:''}`,x.credito,['openVenta',x.ventaId])});
  S.d.pagos.forEach(p=>{if(p.anulaFecha)add(p.anulaFecha,p.anulaPor,'Anulación',`Anuló el recibo ${pad(p.num)} · ${cliName(p.cliId)}${p.anulaMotivo?' · '+p.anulaMotivo:''}`,p.monto,['openRecibo',p.id]);
    const T={cobro:['Cobro','Recibo '+pad(p.num)+' · '+cliName(p.cliId)],aplicaFavor:['Cobro','Aplicó saldo a favor · '+cliName(p.cliId)],gasto:['Gasto',(p.categoria||'Gasto')+(p.nota?' · '+p.nota:'')],pagoProv:['Pago','Pago a '+provName(p.provId)],pagoTarjeta:['Pago','Pago de tarjeta del negocio'],entrada:['Caja','Entrada de efectivo'+(p.nota?' · '+p.nota:'')],salida:['Caja','Salida de efectivo'+(p.nota?' · '+p.nota:'')]}[p.tipo]||['Caja',p.tipo];
    add(p.fecha,p.por,T[0],T[1],p.monto,p.tipo==='cobro'?['openRecibo',p.id]:null)});
  S.d.compras.forEach(c=>add(c.fecha,c.por,c.apertura?'Apertura':'Compra',(c.apertura?'Deuda inicial · ':'Compra · ')+(c.provId?provName(c.provId):'Tarjeta del negocio'),c.total,['openCompra',c.id]));
  S.d.traslados.forEach(t=>add(t.fecha,t.por,'Inventario',`Traslado de ${UBIC[t.desde]} a ${UBIC[t.hacia]} · ${(t.lineas||[]).length} producto(s)`,null,null));
  S.d.movs.forEach(m=>add(m.fecha,m.por,'Inventario',`${m.tipo}${m.nota?' · '+m.nota:''}${Array.isArray(m.lineas)?' · '+m.lineas.length+' cambio(s)':' · '+(d.prod.get(m.pid)?.nombre||'')}`,null,null));
  S.d.cierres.forEach(c=>add(c.fecha,c.por,'Caja',`Cierre de caja del ${fdate(c.dia)} · diferencia ${money(c.diferencia)}`,c.contado,null));
  S.d.clientes.forEach(c=>{add(c.fecha,c.por,'Datos','Creó cliente '+c.nombre,null,['cliOpen',c.id]);if(c.editFecha)add(c.editFecha,c.editPor,'Datos','Editó cliente '+c.nombre,null,['cliOpen',c.id])});
  S.d.productos.forEach(p=>{if(p.por)add(p.fecha,p.por,'Datos','Creó producto '+p.nombre,null,null);if(p.editFecha)add(p.editFecha,p.editPor,'Datos','Editó producto '+p.nombre,null,null)});
  S.d.proveedores.forEach(p=>{add(p.fecha,p.por,'Datos','Creó proveedor '+p.nombre,null,null);if(p.editFecha)add(p.editFecha,p.editPor,'Datos','Editó proveedor '+p.nombre,null,null)});
  return E.sort((a,b)=>a.fecha<b.fecha?1:-1);
}

async function setSeq(k,n,soloSiMayor){const ref=S.db.doc('seq/'+k);

function restOpen(){
  if(!S.admin)return toast('Solo el propietario puede restaurar un respaldo.',1);S.rest=null;
  openModal(`${sheetH('Restaurar respaldo')}<div class="small">Elegí el archivo <b>DISALES-respaldo-….json</b>. Los registros se agregan a esta base; si alguno ya existe con el mismo identificador, se reemplaza por el del respaldo. La numeración nunca retrocede.</div>
  <input type="file" id="restF" accept=".json,application/json"><div id="restInfo"></div><div id="restErr"></div>
  <button class="btn pri" data-a="restSave" id="restBtn" disabled>Restaurar</button>`);
  $('#restF').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();

    if(!ex&&cod)nuevosProd[cod]=true});

  const nuevosCli={};

  cierreRedo:async()=>{try{await del('cierres/c-'+S.cajaDia);toast('Podés cerrar de nuevo')}catch(e){toast(errMsg(e),1)}},
  rp:t=>{S.rp.p=t.dataset.v;render()},rpA:t=>{S.rp.a=t.value;render()},rpB:t=>{S.rp.b=t.value;render()},
  drillVentas:()=>drill('Ventas del período',S.repIds.ventas),drillIds:t=>drill(t.dataset.t,t.dataset.ids.split(',')),
  actU:t=>{actF().u=t.dataset.v;if(route()!=='actividad')location.hash='actividad';else render()},actP:t=>{actF().p=t.dataset.v;render()},actUs:t=>{actF().u=t.value;render()},actTs:t=>{actF().t=t.value;render()},

};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(!f)return;
  if(t.tagName==='BUTTON'||t.tagName==='TR')e.preventDefault();f(t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pf!=null&&t.type==='checkbox'){pfSync();S.modalRender()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ========= arranque ========= */
async function boot(){
  render();
  const db=window.claude&&claude.use?await claude.use('db'):null;
  if(!db){S.nodb=true;render();return}
  S.db=db;
  try{S.user=await claude.use('user');if(S.user){S.uid=await S.user.id();S.admin=await S.user.isOwner();S.write=await S.user.can('data.write')}}catch(e){}
  const pend={};
  const sub=c=>db.collection(c).onSnapshot(snap=>{S.d[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.ready.add(c);pend[c]=snap.metadata.hasPendingWrites;S.pending=Object.values(pend).some(Boolean);S.err=null;ver++;schedule()},
    err=>{S.err=err;schedule();if(err&&err.code==='unavailable')setTimeout(()=>sub(c),4000)});
  COLS.forEach(sub);
  db.doc('ajustes/negocio').onSnapshot(s=>{S.aj=s.exists?s.data():{};ver++;schedule()},()=>{});
}
window.addEventListener('disales-perfiles',()=>{S.names={};refreshNames()}); // versión independiente: llegaron nombres nuevos
window.addEventListener('online',()=>{S.err=null;schedule()});
window.addEventListener('offline',()=>{S.err={code:'unavailable'};schedule()});
boot();
</script>
